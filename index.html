<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181d" media="(prefers-color-scheme: dark)">
<meta name="description" content="日程卡片 · 倒数与正数天数统计">
<title>日程卡片</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Cpath d='M0 14a14 14 0 0 1 14-14h36a14 14 0 0 1 14 14v8H0z' fill='%232f86f6'/%3E%3Ctext x='32' y='52' font-size='30' font-weight='700' text-anchor='middle' fill='%2314181d' font-family='Arial,sans-serif'%3E12%3C/text%3E%3C/svg%3E">
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#e9eef4;
  --surface:#ffffff;
  --surface-2:#f4f6f9;
  --grid:#e9edf2;
  --text:#14181d;
  --text-2:#5b6572;
  --text-3:#8a929c;
  --line:#e3e8ee;
  --shadow:0 6px 20px rgba(17,26,38,.10);
  --shadow-sm:0 2px 8px rgba(17,26,38,.06);
  --stack-shadow:0 22px 46px rgba(17,26,38,.24);
  --stack-shadow-sm:0 12px 24px rgba(17,26,38,.18);
  --spring:cubic-bezier(.16,1.24,.3,1);
  --radius-card:20px;
  --radius-row:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181d;
    --surface:#20242b;
    --surface-2:#1a1e24;
    --grid:#272c34;
    --text:#f2f4f7;
    --text-2:#a8b1bd;
    --text-3:#7c8593;
    --line:#2c323b;
    --shadow:0 6px 20px rgba(0,0,0,.45);
    --shadow-sm:0 2px 8px rgba(0,0,0,.3);
    --stack-shadow:0 22px 46px rgba(0,0,0,.6);
    --stack-shadow-sm:0 12px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#15181d;
  --surface:#20242b;
  --surface-2:#1a1e24;
  --grid:#272c34;
  --text:#f2f4f7;
  --text-2:#a8b1bd;
  --text-3:#7c8593;
  --line:#2c323b;
  --shadow:0 6px 20px rgba(0,0,0,.45);
  --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  --stack-shadow:0 22px 46px rgba(0,0,0,.6);
  --stack-shadow-sm:0 12px 24px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
[hidden]{display:none !important}

/* 关掉浏览器自带的下拉刷新，换成下面这套自己的，避免两套同时触发 */
html,body{overscroll-behavior-y:contain}
html{-webkit-text-size-adjust:100%}

/* ---- 下拉刷新指示器 ---- */
.ptr{
  position:fixed;left:50%;top:0;z-index:60;
  width:44px;height:44px;margin-left:-22px;
  display:flex;align-items:center;justify-content:center;
  border-radius:99px;background:var(--surface);
  box-shadow:var(--shadow);
  color:var(--text-3);font-size:19px;font-weight:800;
  transform:translate3d(0,-64px,0);
  opacity:0;pointer-events:none;
  will-change:transform;
}
.ptr.anim{transition:transform .25s ease, opacity .25s ease}
.ptr.ready{color:#2f86f6}
.ptr .ptr-c{display:block;transition:transform .2s ease}
.ptr.ready .ptr-c{transform:rotate(180deg)}
.ptr.spin .ptr-c{animation:ptr-spin .7s linear infinite;transform:none}
@keyframes ptr-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  .ptr.spin .ptr-c{animation:none}
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ============ 外层布局 ============ */
.app{
  max-width:600px;
  margin:0 auto;
  padding:calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(104px + var(--safe-b)) calc(12px + var(--safe-l));
}

/* ---- 顶部 ---- */
.topbar{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.5px}
.brand .today{margin:2px 0 0;font-size:13px;color:var(--text-2);font-weight:500}
.sync-line{margin:2px 0 0;font-size:12px;color:var(--text-3);font-weight:600}
.sync-line.bad{color:#e0483d}
.icon-btn{
  flex:0 0 auto;width:44px;height:44px;border:0;border-radius:14px;
  background:var(--surface);color:var(--text-2);
  box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.icon-btn:active{transform:scale(.94)}
@media (hover:hover){ .icon-btn:hover{color:var(--text)} }

/* ---- 工具条 ---- */
.toolbar{display:flex;align-items:center;gap:8px;margin:0 2px 14px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;box-shadow:var(--shadow-sm);flex:0 0 auto}
.seg button{
  border:0;background:transparent;color:var(--text-2);
  min-height:44px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;
}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.sort-wrap{flex:1 1 auto;min-width:0;display:flex;justify-content:flex-end}
select.sort{
  min-height:44px;max-width:100%;
  border:0;border-radius:12px;background:var(--surface);color:var(--text-2);
  box-shadow:var(--shadow-sm);padding:0 10px;font-size:14px;font-weight:600;
}

/* ============ 卡片视图 ============ */
.cards{display:flex;flex-direction:column;gap:14px}
.card{
  --c:#2f86f6;--cd:#2670d0;
  position:relative;
  border-radius:var(--radius-card);
  overflow:hidden;
  background:var(--surface);
  box-shadow:var(--shadow);
  border:0;padding:0;width:100%;
  text-align:left;
  display:block;
  color:inherit;
}
.card:active{transform:scale(.99)}
.card-top{
  background:var(--c);
  color:#fff;
  text-align:center;
  font-size:clamp(15px,4.4vw,18px);
  font-weight:800;
  letter-spacing:.5px;
  padding:9px 12px;
}
.card-body{
  display:flex;align-items:center;gap:10px;
  padding:clamp(14px,4.5vw,22px) clamp(14px,4.5vw,20px);
  min-height:118px;
  background-color:var(--surface);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:22px 22px;
  background-position:-1px -1px;
}
.card-left{flex:1 1 auto;min-width:0}
.card-title{
  margin:0;
  font-size:clamp(19px,5.6vw,26px);
  font-weight:800;
  line-height:1.25;
  letter-spacing:.5px;
  overflow-wrap:anywhere;   /* 中文标题一律完整换行显示，不用省略号截断 */
}
.card-sub{margin:6px 0 0;font-size:clamp(12px,3.5vw,15px);color:var(--text-2);font-weight:500}
.tag{
  display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;
  font-size:11px;font-weight:700;color:var(--c);
  background:color-mix(in srgb, var(--c) 14%, transparent);
}
@supports not (color: color-mix(in srgb, red, blue)){ .tag{background:var(--surface-2)} }
.card-num{
  flex:0 0 auto;display:flex;align-items:flex-end;gap:4px;
  padding-left:6px;
}
.card-num .n{
  font-size:clamp(48px,16vw,86px);
  font-weight:800;line-height:.92;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.card-num .u{
  font-size:clamp(14px,4.2vw,21px);font-weight:700;color:var(--text-2);
  transform:translateY(-.3em);
}
.card-num[data-len="4"] .n{font-size:clamp(40px,12.6vw,70px)}
.card-num[data-len="5"] .n{font-size:clamp(31px,10vw,56px)}
.card-num.is-today .n{font-size:clamp(30px,9.4vw,52px);letter-spacing:0}
.card-num.is-today .u{display:none}
.card-num .n.past{color:var(--text-2)}

/* ============ 列表视图 ============ */
.list{
  background:var(--surface-2);
  border-radius:18px;
  padding:10px;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;
}
.row{
  --c:#f5a13c;--cd:#ef7d20;
  display:flex;align-items:stretch;
  background:var(--surface);
  border-radius:var(--radius-row);
  overflow:hidden;
  min-height:58px;
  box-shadow:var(--shadow-sm);
  border:0;padding:0;width:100%;text-align:left;color:inherit;
}
.row:active{transform:scale(.995)}
.row-main{
  flex:1 1 auto;min-width:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:8px 10px 8px 14px;
}
.row-title{
  font-size:clamp(16px,4.6vw,19px);font-weight:700;line-height:1.3;
  overflow-wrap:anywhere;
}
.row-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.row-badge{flex:0 0 auto;display:flex;align-items:stretch}
.row-badge .n{
  background:var(--c);color:#fff;
  min-width:clamp(56px,17vw,80px);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(19px,5.6vw,24px);font-weight:800;
  font-variant-numeric:tabular-nums;
  padding:0 6px;letter-spacing:-.01em;
}
.row-badge .n[data-len="4"]{font-size:clamp(16px,4.6vw,21px)}
.row-badge .n[data-len="5"]{font-size:clamp(14px,4vw,18px)}
.row-badge .n.today-txt{font-size:clamp(14px,4vw,18px);letter-spacing:0}
.row-badge .u{
  background:var(--cd);color:#fff;
  width:clamp(38px,11vw,50px);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(14px,4.2vw,18px);font-weight:700;
}
.row-badge .u.past-u{font-size:clamp(12px,3.6vw,15px);letter-spacing:0}

/* ============ 分组堆叠 ============ */
.group{display:block}
.group-head{
  display:flex;align-items:center;gap:6px;width:100%;
  min-height:44px;padding:0 6px;margin:0;
  color:var(--text-2);font-size:14px;font-weight:800;letter-spacing:.5px;
}
.group-head .g-main{
  flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;
  min-height:44px;border:0;background:transparent;padding:0;
  color:inherit;font:inherit;letter-spacing:inherit;text-align:left;
}
.group-head .g-more{
  flex:0 0 auto;width:44px;height:44px;border:0;background:transparent;
  color:var(--text-3);font-size:18px;font-weight:800;line-height:1;
  display:flex;align-items:center;justify-content:center;border-radius:10px;
}
.group-head .g-more:active{background:var(--surface-2)}
.g-name{overflow-wrap:anywhere;min-width:0}
.g-count{
  flex:0 0 auto;
  font-size:12px;font-weight:700;color:var(--text-3);
  background:var(--surface);padding:2px 9px;border-radius:99px;
  box-shadow:var(--shadow-sm);
}
.list .g-count{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
/* 点击区必须 44×44（触摸标准），但视觉上还是那个 34px 的小圆圈——
   所以圆圈画在内部的 span 上，按钮本身透明 */
.g-chev{
  flex:0 0 auto;
  width:44px;height:44px;border:0;padding:0;background:transparent;
  display:flex;align-items:center;justify-content:center;
  transition:transform .34s cubic-bezier(.22,1,.36,1);
}
.g-chev span{
  width:34px;height:34px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--text-3);
  background:var(--surface);box-shadow:var(--shadow-sm);
}
.group-head[aria-expanded="true"] .g-chev{transform:rotate(180deg)}
.group-head .g-main:active .g-name{opacity:.6}


/* 堆叠容器：真 3D 透视，子项绝对定位后只靠 transform 移动（交给合成器） */
.stack{
  position:relative;
  perspective-origin:50% 0;      /* 灭点放在这一摞的顶边，越往后的卡越往里退 */
  transform-origin:center top;
  transition:height .62s var(--spring), transform .22s ease;
}
.stack.is-pressed{transform:scale(.972)}   /* 按下去整摞往里一压，像真的按到一叠卡 */
.stack > .stack-item{
  position:absolute;left:0;top:0;width:100%;
  transform-origin:center top;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  will-change:transform;
  transition:transform .62s var(--spring), opacity .42s ease;
}
/* 越往后的层压一层暗色，做出"退进阴影里"的空气感 */
.stack > .stack-item::after{
  content:"";position:absolute;inset:0;
  border-radius:var(--radius-card);
  background:#0a1018;opacity:var(--dim,0);
  pointer-events:none;
  transition:opacity .5s ease;
}
.list .stack > .stack-item::after{border-radius:var(--radius-row)}
/* 收起时最上面那张替整摞投影，压得越实越像一叠 */
.stack:not(.is-open) > .stack-item[data-layer="0"] > .card{box-shadow:var(--stack-shadow)}
.stack:not(.is-open) > .stack-item[data-layer="0"] > .row{box-shadow:var(--stack-shadow-sm)}
/* 首次渲染 / 改尺寸时直接就位，不要动画 */
.no-anim .stack, .no-anim .stack > .stack-item{transition:none !important}
@media (prefers-reduced-motion: reduce){
  .stack, .stack > .stack-item, .g-chev{transition:none !important}
}

/* ============ 置顶区 ============ */
.pinned-sec{margin-bottom:4px}
.pinned-head{color:var(--text-2)}
.pinned{ /* 置顶区不堆叠，平铺显示——置顶就是为了一眼看见 */ }
.cards.pinned, .list.pinned{box-shadow:none}
.list.pinned{background:var(--surface-2)}

/* ============ 长按拖拽排序 ============ */
body.dragging{user-select:none;-webkit-user-select:none;touch-action:none}
.drag-sliding{transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.drag-lift{
  transition:none !important;
  z-index:50;position:relative;
  filter:drop-shadow(0 14px 26px rgba(17,26,38,.28));
}
.drag-lift .card, .drag-lift .row{opacity:.96}
body.just-dragged .card, body.just-dragged .row, body.just-dragged .group-head{pointer-events:none}

/* ============ 空状态 ============ */
.empty{
  text-align:center;padding:56px 20px;color:var(--text-2);
  background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);
}
.empty .big{font-size:38px;margin-bottom:10px}
.empty p{margin:0 0 4px;font-size:15px}

/* ============ 悬浮新增按钮 ============ */
.fab{
  position:fixed;
  /* 宽屏上放在内容列**外面**的空白里：按钮左边缘距列右边缘 16px，既不压住卡片，
     也不会缩到屏幕角落。算式：右边距 = 半屏 - 300(半列宽) - 58(按钮宽) - 16(间距) = 50vw - 374px。
     屏幕不够宽时这个值是负的/太小，被 max() 兜回 16px，回到手机上那种压在内容上的老行为 */
  right:max(calc(16px + var(--safe-r)), calc(50vw - 374px));
  bottom:calc(18px + var(--safe-b));
  width:58px;height:58px;border-radius:20px;border:0;
  background:#2f86f6;color:#fff;font-size:30px;line-height:1;
  box-shadow:0 8px 22px rgba(47,134,246,.42);
  display:flex;align-items:center;justify-content:center;
  z-index:30;
}
.fab:active{transform:scale(.93)}

/* ============ 菜单 ============ */
.menu-mask{position:fixed;inset:0;z-index:40}
.menu{
  position:fixed;z-index:41;
  top:calc(58px + var(--safe-t));right:calc(12px + var(--safe-r));
  min-width:196px;max-width:calc(100vw - 24px);
  background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
  padding:6px;overflow:hidden;
}
.menu button, .menu label{
  display:flex;align-items:center;gap:10px;width:100%;
  min-height:46px;padding:0 12px;border:0;background:transparent;
  border-radius:10px;font-size:15px;font-weight:600;text-align:left;color:var(--text);
}
.menu button:active,.menu label:active{background:var(--surface-2)}
@media (hover:hover){ .menu button:hover,.menu label:hover{background:var(--surface-2)} }
.menu .danger{color:#e0483d}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 8px}
.switch{margin-left:auto;font-size:13px;color:var(--text-2);font-weight:700}

/* ============ 弹窗（新增/编辑） ============ */
.mask{
  position:fixed;inset:0;z-index:50;
  background:rgba(12,16,22,.42);
  display:flex;align-items:flex-end;justify-content:center;
  padding:0;
}
@media (min-width:560px){ .mask{align-items:center;padding:20px} }
.sheet{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--surface);
  border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + var(--safe-b));
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
@media (min-width:560px){ .sheet{border-radius:20px;padding-bottom:18px} }
.sheet h2{margin:2px 0 16px;font-size:19px;font-weight:800}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.field input[type="text"],.field input[type="date"],.field select{
  width:100%;min-height:48px;
  border:1px solid var(--line);border-radius:12px;
  background:var(--surface-2);
  padding:0 12px;font-size:16px;
}
.field input[type="date"]{-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{outline:2px solid #2f86f6;outline-offset:1px;border-color:transparent}
.modes{display:flex;gap:8px}
.modes input{position:absolute;opacity:0;width:0;height:0}
.modes label{
  flex:1 1 0;min-width:0;min-height:48px;margin:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--line);
  font-size:15px;font-weight:700;color:var(--text-2);
  touch-action:manipulation;
}
.modes input:checked + label{background:#2f86f6;color:#fff;box-shadow:none}
.modes input:focus-visible + label{outline:2px solid var(--text);outline-offset:2px}
.hint{margin:8px 2px 0;font-size:13px;line-height:1.5;color:var(--text-3)}
/* ---- 日期下面的实时倒计时 ---- */
.countdown{
  margin-top:8px;padding:10px 12px;border-radius:12px;
  background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);
  display:flex;flex-direction:column;gap:2px;
}
.countdown .cd-num{
  font-size:17px;font-weight:800;letter-spacing:.2px;
  font-variant-numeric:tabular-nums;   /* 等宽数字，秒跳动时整行不会左右抖 */
  color:var(--text-2);
}
.countdown .cd-base{font-size:12px;font-weight:600;color:var(--text-3)}
/* 越紧迫越显眼——这比数字本身更能让人有压力 */
.countdown.soon  .cd-num{color:#ef7d20}                    /* 7 天内 */
.countdown.urgent .cd-num{color:#e0483d}                   /* 24 小时内 */
.countdown.urgent{background:rgba(224,72,61,.08);box-shadow:inset 0 0 0 1px rgba(224,72,61,.35)}
.countdown.past  .cd-num{color:var(--text-3)}              /* 已过期/已累计 */

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{
  min-height:44px;padding:0 14px;border:0;border-radius:12px;
  background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);
  font-size:14px;font-weight:700;color:var(--text-2);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chips button.on{background:#2f86f6;color:#fff;box-shadow:none}
/* 中间这个是"选择已有分组"的下拉：它自带菜单，所以要能定位 */
.chip-sel{position:relative;display:inline-flex;max-width:100%}
.chip-sel > button::after{content:"▾";margin-left:6px;font-size:12px;opacity:.7}
.chip-sel .dp-menu{top:calc(100% + 6px);left:0;min-width:120px}
/* ---- 日期触发按钮（原来是原生 input[type=date]） ---- */
.date-trigger{
  width:100%;min-height:48px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;

/* ---- 日期选择器弹层 ---- */
.dp-mask{
  position:fixed;inset:0;z-index:70;
  background:rgba(12,16,22,.42);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
.dp{
  width:100%;max-width:360px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;

}
.dp-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:relative;z-index:10}
.dp-sel{position:relative}
.dp-selbtn{
  min-height:44px;padding:0 12px;border:0;border-radius:10px;

}
.dp-selbtn::after{content:"▾";font-size:13px;color:var(--text-3)}
.dp-selbtn:active{background:var(--line)}
.dp-menu{
  position:absolute;top:calc(100% + 6px);left:0;z-index:100;
  min-width:104px;max-height:220px;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;

}
.dp-menu button{

}
.dp-menu button.on{background:#2f86f6;color:#fff}

.dp-today{

}
.dp-today:active{background:rgba(47,134,246,.24)}
.dp-week,.dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-week span{font-size:12px;color:var(--text-3);font-weight:600;padding-bottom:6px}
.dp-days button{
  height:44px;border:0;background:transparent;border-radius:50%;
  color:var(--text);font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
.dp-days button:active{background:var(--surface-2)}
.dp-days .dp-empty{visibility:hidden;pointer-events:none}

.dp-days button.sel{

}
.dp-actions{display:flex;gap:12px;margin-top:14px}

.colors{display:flex;flex-wrap:wrap;gap:10px}

/* 置顶：一个开关按钮，左边写当前状态、右边写点了会怎样，不再是两个并排选项 */
.pin-toggle{
  width:100%;min-height:50px;

<script>
(function(){
"use strict";

/* ================= 常量 ================= */
var STORE_KEY = "schedule-cards-v1";
var WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
var COLORS = ["#2f86f6","#f5a13c","#ef4d4d","#22b07d","#8a6ef2","#4b5563"];
var THEMES = [
  {v:"auto",  t:"跟随系统"},
  {v:"light", t:"浅色"},
  {v:"dark",  t:"深色"}
];

/* ================= 状态 ================= */
var state = {
  events: [],
  view: "card",
  sort: "manual",
  showDateInList: false,
  theme: "auto",
  expanded: []          /* 处于展开状态的分组名 */
};
var editingId = null;
var todayKey = "";

/* ================= 本地存储（可能被禁用，全部包 try） ================= */
function load(){
  var raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch(e){ raw = null; }
  if(!raw){ state.events = syncAlreadyOn() ? [] : seed(); migrate(); save(); return; }
  try{
    var d = JSON.parse(raw);
    if(d && Array.isArray(d.events)) state.events = d.events;
    if(d && (d.view === "card" || d.view === "list")) state.view = d.view;
    if(d && d.sort) state.sort = d.sort;
    if(d && typeof d.showDateInList === "boolean") state.showDateInList = d.showDateInList;
    if(d && d.theme) state.theme = d.theme;
    if(d && Array.isArray(d.expanded)) state.expanded = d.expanded;
  }catch(e){
    state.events = seed();
  }
  migrate();
}

/* 老数据补齐新字段：分组、创建时间、修改时间。
   创建时间按原有数组顺序倒推，保证「按创建时间」排序对老数据也等于原来的顺序 */
function migrate(){
  var now = Date.now(), n = state.events.length, changed = false;
  state.events.forEach(function(e, i){
    if(typeof e.group !== "string"){ e.group = ""; changed = true; }
    if(typeof e.createdAt !== "number"){ e.createdAt = now - (n - i) * 60000; changed = true; }
    if(typeof e.updatedAt !== "number"){ e.updatedAt = e.createdAt; changed = true; }
    /* 自定义顺序原来靠数组位置，跨设备合并后位置就没了，改成显式的 order 字段 */
    if(typeof e.order !== "number"){ e.order = i; changed = true; }
    /* 2026-09-09 去掉了「每年重复」，存量数据里的这个字段一并清掉，免得留着让人困惑。
       不改 updatedAt：两台设备各自迁移的结果一样，没必要为此触发一次同步写 */
    if("repeat" in e){ delete e.repeat; changed = true; }
  });
  /* 删除标记（墓碑）留够久，保证另一台设备下次上线还能收到这条删除；再老就清掉 */
  var keep = state.events.filter(function(e){
    return !e.deletedAt || (now - e.deletedAt) < 120 * 24 * 3600 * 1000;
  });
  if(keep.length !== state.events.length){ state.events = keep; changed = true; }
  if(changed) save();
}

/* 没被删掉的那些——所有显示、分组、排序都只看这个 */
function liveEvents(){
  return state.events.filter(function(e){ return !e.deletedAt; });
}
function orderMax(){
  var m = 0;
  state.events.forEach(function(e){ if(typeof e.order === "number" && e.order > m) m = e.order; });
  return m;
}
function orderMin(){
  var m = 0;
  state.events.forEach(function(e){ if(typeof e.order === "number" && e.order < m) m = e.order; });
  return m;
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
/* 示例数据。两个关键点：
   ① id 固定（不是随机的）——否则两台设备各自生成一套，合并时会被当成不同的条目，变成每条两份
   ② 打 demo 标记——一旦开了同步，这些示例不上传、本地也退场，绝不参与合并 */
function seed(){
  var t = new Date();
  var y = t.getFullYear();
  return [
    {id:"demo-1", demo:true, title:"回家过年啦", date:"2027-01-10", mode:"down", color:"#2f86f6", group:"生活"},
    {id:"demo-2", demo:true, title:"我的生日",   date:(y)+"-11-06",  mode:"down", color:"#f5a13c", group:"生活"},
    {id:"demo-3", demo:true, title:"四级考试",   date:(y)+"-12-19",  mode:"down", color:"#ef4d4d", group:"考试"},
    {id:"demo-4", demo:true, title:"计组考试",   date:(y+1)+"-01-04",mode:"down", color:"#8a6ef2", group:"考试"},
    {id:"demo-5", demo:true, title:"开学第一天", date:ymd(new Date(y, t.getMonth(), 1)), mode:"up", color:"#22b07d", group:""}
  ];
}
/* 已经在用同步的设备，重装/换浏览器后不要再撒一次示例数据，直接等云端的 */
function syncAlreadyOn(){
  try{
    var s = JSON.parse(localStorage.getItem(SYNC_KEY) || "null");
    return !!(s && s.on && s.code);
  }catch(e){ return false; }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }


/* ================= 农历（公历 → 农历） =================
   数据表与换算逻辑取自 fjkkx77/data-Calculation，那边是用香港天文台
   《公曆與農曆日期對照表》1901-2100 逐日文本生成并全区间比对过的。
   ⚠️ 不要改用浏览器内置的 Intl chinese 历法——它在这 200 年里有 12 段临界日算错
   （含 2027 年春节），细节见记忆 reference-lunar-calendar-data。
   每个数字：bit0-3 闰月号(0=无)，bit4-16 各月大小(1=30天)，bit17-22 正月初一距 1月1日的天数 */
const LUNAR_TABLE = [
        0x627520,0x4cea50,0x3964a5,0x5c64b0,0x44a9b0,0x315564,0x5656a0,0x40b590,0x2b7522,0x507520,
        0x3bb256,0x60b250,0x48a4b0,0x334ab5,0x582ad0,0x4256b0,0x2cb692,0x52da90,0x3fd927,0x64e920,

var LUNAR_MIN_YEAR = 1901;
var LUNAR_MAX_YEAR = LUNAR_MIN_YEAR + LUNAR_TABLE.length - 1;
var LUNAR_MONTH_NAMES = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
var LUNAR_DAY_TENS = ["初","十","廿","三"];
var LUNAR_DIGITS = ["〇","一","二","三","四","五","六","七","八","九"];
var MS_PER_DAY = 86400000;

function getLunarYearInfo(ly){
  var raw = LUNAR_TABLE[ly - LUNAR_MIN_YEAR];
  if(raw === undefined) return null;
  var leapMonth = raw & 0xF;
  var sizeBits = (raw >> 4) & 0x1FFF;
  var newYearOffset = (raw >> 17) & 0x3F;
  var count = leapMonth ? 13 : 12, days = [], i;
  for(i = 0; i < count; i++) days.push(((sizeBits >> i) & 1) ? 30 : 29);
  return { year: ly, leapMonth: leapMonth, monthDays: days,
           newYearMs: Date.UTC(ly, 0, 1) + newYearOffset * MS_PER_DAY };
}
function solarToLunar(y, m, d){
  var ms = Date.UTC(y, m - 1, d);
  var info = getLunarYearInfo(y);
  if(!info || ms < info.newYearMs) info = getLunarYearInfo(y - 1);
  if(!info || ms < info.newYearMs) return null;
  var offset = Math.round((ms - info.newYearMs) / MS_PER_DAY), idx = 0;
  while(idx < info.monthDays.length && offset >= info.monthDays[idx]){
    offset -= info.monthDays[idx]; idx++;
  }
  if(idx >= info.monthDays.length) return null;
  var lm, leap;
  if(!info.leapMonth || idx < info.leapMonth){ lm = idx + 1; leap = false; }
  else if(idx === info.leapMonth){ lm = info.leapMonth; leap = true; }
  else { lm = idx; leap = false; }
  return { year: info.year, month: lm, isLeap: leap, day: offset + 1 };
}
function lunarDayCn(d){
  if(d === 10) return "初十";
  if(d === 20) return "二十";
  if(d === 30) return "三十";
  return LUNAR_DAY_TENS[Math.floor(d / 10)] + LUNAR_DIGITS[d % 10];
}
/* 给一个 Date，返回「农历七月廿八」；超出 1901-2100 就返回空字符串，不外推 */
function lunarLabel(d){
  if(!d) return "";
  var l = solarToLunar(d.getFullYear(), d.getMonth() + 1, d.getDate());
  if(!l) return "";
  return "农历" + (l.isLeap ? "闰" : "") + LUNAR_MONTH_NAMES[l.month - 1] + "月" + lunarDayCn(l.day);
}

/* ================= 日期工具（全部按“零点”比较，避免时区/时分误差） ================= */
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function today(){ return midnight(new Date()); }
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function parseYMD(s){
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s||""));
  if(!m) return null;
  var d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d.getTime()) ? null : d;
}
function dayDiff(a, b){ return Math.round((a - b) / 86400000); }

/* 计算方式：down=倒数（还剩多少天），up=正数（累计多少天），auto=未来倒数/过去正数 */
function modeOf(ev){
  return (ev.mode === "down" || ev.mode === "up") ? ev.mode : "auto";
}

/* 算出这条日程指向的那一天。2026-09-09 起去掉了「每年重复」，日期就是日期，不再推算下一次 */
function resolve(ev, t){
  var base = parseYMD(ev.date);
  if(!base) return null;
  return {date: base, base: base};
}

/* 深浅色都用得上的“压暗”函数：不依赖 color-mix，兼容性最好 */
function shade(hex, ratio){
  var m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if(!m) return hex;
  var v = parseInt(m[1], 16);
  var r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
  function f(x){ return Math.max(0, Math.min(255, Math.round(x * (1 + ratio)))); }
  return "#" + pad2(f(r)) + pad2(f(g)) + pad2(f(b));
}
function pad2(n){ var s = n.toString(16); return s.length < 2 ? "0" + s : s; }

/* ================= 渲染 ================= */
var board = document.getElementById("board");

function sortedEvents(){
  var t = today();
  var arr = liveEvents();
  if(state.sort === "manual"){                /* 自定义顺序按 order 字段，跨设备合并后也稳定 */
    arr.sort(function(a,b){ return (a.order || 0) - (b.order || 0); });
  }else if(state.sort === "days"){
    arr.sort(function(a,b){
      return rank(a,t) - rank(b,t);
    });
  }else if(state.sort === "date"){
    arr.sort(function(a,b){
      var ra = resolve(a,t), rb = resolve(b,t);
      if(!ra) return 1; if(!rb) return -1;
      return ra.date - rb.date;
    });
  }else if(state.sort === "created"){        /* 先建的排前面 */
    arr.sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
  }else if(state.sort === "updated"){        /* 最近改过的排前面 */
    arr.sort(function(a,b){ return (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0); });
  }
  return arr;
}

function isPinned(ev){ return !!ev.pinned; }

/* 把排好序的列表按分组聚拢：分组出现的位置＝该组第一条的位置，未分组的各自独立占位 */
function groupize(list){
  var out = [], idx = {};
  list.forEach(function(ev){
    var g = (ev.group || "").trim();
    if(!g){ out.push({name:"", items:[ev]}); return; }
    if(!Object.prototype.hasOwnProperty.call(idx, g)){
      idx[g] = out.length;
      out.push({name:g, items:[]});
    }
    out[idx[g]].items.push(ev);
  });
  return out;
}

function allGroups(){
  var seen = {}, out = [];
  liveEvents().forEach(function(e){
    var g = (e.group || "").trim();
    if(g && !Object.prototype.hasOwnProperty.call(seen, g)){ seen[g] = 1; out.push(g); }
  });
  return out;
}
function isExpanded(name){ return state.expanded.indexOf(name) > -1; }
/* 分组被删空/改名后，把记在展开列表里的空壳清掉 */
function pruneExpanded(){
  var live = allGroups();
  state.expanded = state.expanded.filter(function(g){ return live.indexOf(g) > -1; });
}
/* 未来的按“还剩几天”从小到大排前面；已过去的排后面，越近的越靠前 */
function rank(ev, t){
  var r = resolve(ev, t);
  if(!r) return 1e9;
  var d = dayDiff(r.date, t);
  return d >= 0 ? d : 500000 - d;
}

function render(){
  var t = today();
  todayKey = ymd(t);
  var lun = lunarLabel(t);
  document.getElementById("todayLine").textContent =
    ymd(t) + " " + WEEK[t.getDay()] + (lun ? " · " + lun : "");

  var list = sortedEvents();
  board.innerHTML = "";

  if(list.length === 0){
    var e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = '<div class="big">🗓</div><p>还没有日程</p><p style="color:var(--text-3);font-size:13px">点右下角的「＋」添加第一个</p>';
    board.appendChild(e);
    return;
  }

  var isCard = state.view === "card";
  var make = function(ev){ return isCard ? cardEl(ev, t) : rowEl(ev, t); };

  /* 置顶区：不管当前用哪种排序都排在最上面，而且不堆叠——
     置顶就是为了"一眼看见"，再折起来就自相矛盾了 */
  var pins = list.filter(isPinned);
  if(pins.length){
    var psec = document.createElement("section");
    psec.className = "group pinned-sec";
    var phead = document.createElement("div");
    phead.className = "group-head pinned-head";
    phead.innerHTML = '<span class="g-name">📌 置顶</span><span class="g-count"></span>';
    phead.querySelector(".g-count").textContent = pins.length;
    var pbox = document.createElement("div");
    pbox.className = isCard ? "cards pinned" : "list pinned";
    pins.forEach(function(ev){ pbox.appendChild(make(ev)); });
    psec.appendChild(phead);
    psec.appendChild(pbox);
    board.appendChild(psec);
  }

  var box = document.createElement("div");
  box.className = isCard ? "cards" : "list";

  groupize(list.filter(function(e){ return !isPinned(e); })).forEach(function(g){
    if(!g.name){                                  /* 没分组的直接平铺 */
      box.appendChild(make(g.items[0]));
      return;
    }

    var sec = document.createElement("section");
    sec.className = "group";

    /* 标题栏是个容器：左半边点了展开/收起，右边是「⋯」管理菜单。
       用 div 包着两个 button——button 里不能再套 button */
    var head = document.createElement("div");
    head.className = "group-head";
    head.setAttribute("aria-expanded", isExpanded(g.name) ? "true" : "false");

    var gmain = document.createElement("button");
    gmain.type = "button";
    gmain.className = "g-main";
    gmain.setAttribute("aria-expanded", isExpanded(g.name) ? "true" : "false");
    gmain.innerHTML = '<span class="g-name"></span><span class="g-count"></span>';
    gmain.querySelector(".g-name").textContent = g.name;
    gmain.querySelector(".g-count").textContent = g.items.length;
    gmain.addEventListener("click", function(){ toggleGroup(g.name); });

    var gmore = document.createElement("button");
    gmore.type = "button";
    gmore.className = "g-more";
    gmore.setAttribute("aria-label", "管理分组「" + g.name + "」");
    gmore.textContent = "⋯";
    gmore.addEventListener("click", function(e){ e.stopPropagation(); openGroupMenu(g.name, gmore); });

    var gchev = document.createElement("button");
    gchev.type = "button";
    gchev.className = "g-chev";
    gchev.setAttribute("aria-label", "展开或收起");
    gchev.innerHTML = "<span>▾</span>";
    gchev.addEventListener("click", function(){ toggleGroup(g.name); });

    head.appendChild(gmain);
    head.appendChild(gmore);
    head.appendChild(gchev);

    var stack = document.createElement("div");
    stack.className = "stack";
    stack.setAttribute("data-group", g.name);
    /* 收起状态下按住这一摞会整体往里压一下，松开才展开——手感上像真的按到一叠卡 */
    if(g.items.length > 1){
      var press = function(on){
        return function(){
          stack.classList.toggle("is-pressed", on && !isExpanded(g.name));
        };
      };
      stack.addEventListener("pointerdown", press(true));
      stack.addEventListener("pointerup", press(false));
      stack.addEventListener("pointercancel", press(false));
      stack.addEventListener("pointerleave", press(false));
    }
    g.items.forEach(function(ev){
      var wrap = document.createElement("div");
      wrap.className = "stack-item";
      wrap.appendChild(make(ev));
      stack.appendChild(wrap);
    });

    sec.appendChild(head);
    sec.appendChild(stack);
    box.appendChild(sec);
  });

  board.appendChild(box);
  layoutStacks(false);
}

/* ---- 堆叠布局 ----
   收起：只露出最上面一张，后面每张往下探出 PEEK 像素、逐层缩小，像一叠卡片
   展开：依次排成一列，每张之间留 GAP
   位置全部用 transform 表达，容器只改 height，动画交给合成器 */
var PERSPECTIVE = 880;  /* 透视距离，直接写到 .stack 上，保证 CSS 与这里的算式同源 */
var DEPTH = 150;        /* 每往后一层退多远（z 轴），退得越远投影越小 —— 这才是空间感的来源 */
var TILT = 1.15;        /* 每层轻微歪一点点，像随手叠上去的 */
var DIM = .07;          /* 每往后一层压多少暗色（压太狠会把彩色badge压成脏褐色，实测调低） */
var VISIBLE = 3;        /* 收起时最多露几层 */

/* 露出量和间距都跟着视图走：卡片高（~160px）撑得住大露出，列表行只有 58px */
function stackPeek(){ return state.view === "card" ? 26 : 12; }
function stackGap(){ return state.view === "card" ? 14 : 10; }

function layoutStacks(animate){
  var stacks = board.querySelectorAll(".stack");
  if(!stacks.length) return;
  if(!animate) board.classList.add("no-anim");

  for(var s = 0; s < stacks.length; s++){
    var stack = stacks[s];
    var items = stack.children;
    var n = items.length;
    if(!n) continue;

    var name = stack.getAttribute("data-group");
    /* 只有一张时没有“堆”的概念，永远当展开处理 */
    var open = (n === 1) || isExpanded(name);

    var h = [], i;
    for(i = 0; i < n; i++) h[i] = items[i].offsetHeight;   /* 先量完再写，避免反复触发重排 */

    stack.style.perspective = PERSPECTIVE + "px";   /* 与下面的 k 算式同源，避免两处各写一个值 */
    stack.classList.toggle("is-open", open);

    var gap = stackGap(), peek = stackPeek(), total;
    if(open){
      var y = 0;
      for(i = 0; i < n; i++){
        place(items[i], {y:y, z:0, tilt:0, dim:0, blur:0, op:1, pe:"auto", z9:n - i, layer:i,
                         delay: animate ? i * 62 : 0});
        y += h[i] + gap;
      }
      total = y - gap;
    }else{
      /* 每一层往后退 DEPTH 像素，透视把它投影成 k 倍大小：k = P / (P + 深度)。
         灭点定在这一摞的顶边(perspective-origin:50% 0)，所以投影就是绕顶边的等比缩放，
         于是「第 i 层的底边正好比上一层低 peek 像素」可以反解出它该往下平移多少：
             ty = (h0 + i*peek) / k - h[i]
         这样卡片高、列表行矮，都能得到同样的露出量，不用按某一档硬写死。 */
      for(i = 0; i < n; i++){
        var L = Math.min(i, VISIBLE);
        var k = PERSPECTIVE / (PERSPECTIVE + L * DEPTH);
        var ty = (h[0] + L * peek) / k - h[i];
        place(items[i], {
          y: ty, z: -L * DEPTH, tilt: (i % 2 ? 1 : -1) * L * TILT,
          dim: L * DIM, blur: L >= 2 ? 1.4 : 0,
          op: i < VISIBLE ? 1 : 0, pe: i < VISIBLE ? "auto" : "none",
          z9: n - i, layer: i,
          delay: animate ? (n - 1 - i) * 40 : 0
        });
      }
      total = h[0] + Math.min(n - 1, VISIBLE - 1) * peek;
    }
    stack.style.height = total + "px";
  }

  if(!animate){
    void board.offsetHeight;          /* 强制应用一次，再把动画打开 */
    board.classList.remove("no-anim");
  }
}

function place(el, o){
  el.style.transform =
    "translate3d(0," + o.y.toFixed(2) + "px," + o.z.toFixed(1) + "px)" +
    (o.tilt ? " rotate(" + o.tilt.toFixed(2) + "deg)" : " rotate(0deg)");
  el.style.opacity = o.op.toFixed(2);
  el.style.filter = o.blur ? ("blur(" + o.blur + "px)") : "";
  el.style.setProperty("--dim", o.dim.toFixed(3));
  el.style.pointerEvents = o.pe;
  el.style.zIndex = String(o.z9);
  el.style.transitionDelay = o.delay ? (o.delay + "ms") : "0ms";
  el.setAttribute("data-layer", String(o.layer));
  /* 被压在下面看不见的那几张，别让键盘 Tab 还能聚焦到 */
  var btn = el.firstElementChild;
  if(btn) btn.tabIndex = (o.pe === "none") ? -1 : 0;
}

function toggleGroup(name){
  var i = state.expanded.indexOf(name);
  if(i > -1) state.expanded.splice(i, 1);
  else state.expanded.push(name);
  save();
  var heads = board.querySelectorAll(".group-head");
  for(var k = 0; k < heads.length; k++){
    var st = heads[k].nextElementSibling;
    if(st && st.getAttribute("data-group") === name){
      heads[k].setAttribute("aria-expanded", isExpanded(name) ? "true" : "false");
    }
  }
  layoutStacks(true);
}

/* 一条日程当前要显示成什么样，全部在这里算清楚
   state:  left      倒数中——距离目标还剩 N 天
           dueToday  倒数到期——就是今天
           overdue   倒数已过期——目标日已经过去 N 天
           elapsed   正数中——从起算日起已累计 N 天
           startToday正数起算日就是今天
           notStarted正数的起算日还没到——N 天后开始   */
function numInfo(ev, t){
  var r = resolve(ev, t);
  if(!r) return {bad:true};
  var d = dayDiff(r.date, t);              /* >0 在未来，<0 已过去 */
  var m = modeOf(ev);
  if(m === "auto") m = (d >= 0) ? "down" : "up";

  var state;
  if(m === "down") state = d > 0 ? "left" : (d === 0 ? "dueToday" : "overdue");
  else             state = d < 0 ? "elapsed" : (d === 0 ? "startToday" : "notStarted");

  var UNIT = {left:"天", overdue:"天前", elapsed:"天了", notStarted:"天后"};
  var TEXT = {dueToday:"就是今天", startToday:"今天开始"};

  return {
    mode: m,
    state: state,
    diff: d,
    abs: Math.abs(d),
    unit: UNIT[state] || "",
    bigText: TEXT[state] || "",
    muted: state === "overdue" || state === "notStarted",
    target: r.date,
    dateLabel: (m === "down" ? "目标 " : "起算 ")
  };
}

function groupCount(g){
  var c = 0;
  liveEvents().forEach(function(e){ if((e.group || "").trim() === g) c++; });
  return c;
}
/* 收起状态下点这一叠＝展开；展开状态（或没分组、组里只有一条）下点＝编辑 */
function activate(ev){
  var g = (ev.group || "").trim();
  if(g && !isExpanded(g) && groupCount(g) > 1){ toggleGroup(g); return; }
  openForm(ev.id);
}

function tagEl(text){
  var s = document.createElement("span");

function cardEl(ev, t){
  var info = numInfo(ev, t);
  var el = document.createElement("button");
  el.type = "button";
  el.className = "card";
  el.style.setProperty("--c", ev.color || COLORS[0]);
  el.style.setProperty("--cd", shade(ev.color || COLORS[0], -0.16));
  el.setAttribute("aria-label", (ev.title || "未命名") + "，点击编辑");
  el.setAttribute("data-id", ev.id);      /* 拖拽重排时靠它把 DOM 顺序写回数据 */

  var top = document.createElement("div");
  top.className = "card-top";
  top.textContent = (t.getMonth()+1) + "月" + t.getDate() + "日 " + WEEK[t.getDay()];

  var body = document.createElement("div");
  body.className = "card-body";

  var left = document.createElement("div");
  left.className = "card-left";
  var h = document.createElement("h2");
  h.className = "card-title";
  h.textContent = ev.title || "未命名";
  var sub = document.createElement("p");
  sub.className = "card-sub";
  if(info.bad){
    sub.textContent = "日期无效";
  }else{
    sub.textContent = info.dateLabel + ymd(info.target) + " " + WEEK[info.target.getDay()];
    if(info.state === "overdue")    sub.appendChild(tagEl("已过期"));
    if(info.state === "elapsed")    sub.appendChild(tagEl("已累计"));
    if(info.state === "notStarted") sub.appendChild(tagEl("未开始"));
    /* 置顶的卡片离开了原分组，把它原来属于哪组标出来，免得找不着 */
    if(isPinned(ev) && (ev.group || "").trim()) sub.appendChild(tagEl("原属 " + ev.group.trim()));
  }
  left.appendChild(h); left.appendChild(sub);

  var num = document.createElement("div");
  num.className = "card-num";
  var n = document.createElement("span");
  n.className = "n";
  var u = document.createElement("span");
  u.className = "u";
  if(info.bad){
    n.textContent = "—";
    u.textContent = "天";
  }else if(info.bigText){
    num.classList.add("is-today");
    n.textContent = info.bigText;
  }else{
    n.textContent = String(info.abs);
    u.textContent = info.unit;
    num.setAttribute("data-len", String(info.abs).length);
    if(info.muted) n.classList.add("past");
  }
  num.appendChild(n); num.appendChild(u);

  body.appendChild(left); body.appendChild(num);
  el.appendChild(top); el.appendChild(body);
  el.addEventListener("click", function(){ activate(ev); });
  return el;
}

function rowEl(ev, t){
  var info = numInfo(ev, t);
  var el = document.createElement("button");
  el.type = "button";
  el.className = "row";
  el.style.setProperty("--c", ev.color || COLORS[1]);
  el.style.setProperty("--cd", shade(ev.color || COLORS[1], -0.16));
  el.setAttribute("aria-label", (ev.title || "未命名") + "，点击编辑");
  el.setAttribute("data-id", ev.id);      /* 拖拽重排时靠它把 DOM 顺序写回数据 */

  var main = document.createElement("div");
  main.className = "row-main";
  var tt = document.createElement("div");
  tt.className = "row-title";
  tt.textContent = ev.title || "未命名";
  main.appendChild(tt);
  if(state.showDateInList && !info.bad){
    var s = document.createElement("div");
    s.className = "row-sub";
    var extra = "";
    if(info.state === "overdue")    extra += " · 已过期";
    if(info.state === "elapsed")    extra += " · 已累计";
    if(info.state === "notStarted") extra += " · 未开始";
    s.textContent = info.dateLabel + ymd(info.target) + " " + WEEK[info.target.getDay()] + extra;
    main.appendChild(s);
  }

  var badge = document.createElement("div");
  badge.className = "row-badge";
  var n = document.createElement("div");
  n.className = "n";
  var u = document.createElement("div");
  u.className = "u";
  if(info.bad){
    n.textContent = "—";
    u.textContent = "天";
  }else if(info.bigText){
    n.textContent = info.bigText;
    n.classList.add("today-txt");
    u.hidden = true;                 /* 「就是今天」「今天开始」整格让给文字 */
  }else{
    n.textContent = String(info.abs);
    n.setAttribute("data-len", String(info.abs).length);
    u.textContent = info.unit;       /* 天 / 天前 / 天了 / 天后，一眼看出是倒数还是正数 */
    if(info.unit.length > 1) u.classList.add("past-u");
  }
  badge.appendChild(n); badge.appendChild(u);

  el.appendChild(main); el.appendChild(badge);
  el.addEventListener("click", function(){ activate(ev); });
  return el;
}

var fileInput = document.getElementById("fileInput");

  closeMenu(); fileInput.value = ""; fileInput.click();
});
fileInput.addEventListener("change", function(){
  var f = fileInput.files && fileInput.files[0];
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var d = JSON.parse(String(fr.result));
      var arr = Array.isArray(d) ? d : (d && d.events);
      if(!Array.isArray(arr)) throw new Error("格式不对");
      var clean = [];
      arr.forEach(function(x){
        if(!x || !parseYMD(x.date)) return;
        clean.push({
          id: x.id || uid(),
          title: String(x.title || "未命名").slice(0,30),
          date: x.date,
          mode: (x.mode === "down" || x.mode === "up") ? x.mode : "auto",
          group: typeof x.group === "string" ? x.group.trim().slice(0,12) : "",
          pinned: x.pinned === true,
          color: /^#[0-9a-fA-F]{6}$/.test(x.color || "") ? x.color : COLORS[0],
          createdAt: (typeof x.createdAt === "number" && x.createdAt > 0) ? x.createdAt : undefined,
          updatedAt: (typeof x.updatedAt === "number" && x.updatedAt > 0) ? x.updatedAt : undefined
        });
      });
      if(!clean.length) throw new Error("没有可用的日程");
      /* 导入＝"用这份备份替换现在的数据"。本地原有、备份里没有的那些要打删除标记，
         否则开着同步时它们会从另一台设备又回来 */
      var keepIds = {}, tnow = Date.now();
      clean.forEach(function(x){ keepIds[x.id] = 1; });
      state.events.forEach(function(x){
        if(!keepIds[x.id] && !x.deletedAt){ x.deletedAt = tnow; x.updatedAt = tnow; clean.push(x); }
      });
      state.events = clean;
      migrate();                    /* 备份文件里没有创建时间/顺序的，按顺序补上 */
      pruneExpanded();
      save(); queueSync(); render();
    }catch(e){
      alert("导入失败：" + e.message);
    }
  };
  fr.readAsText(f);
});
document.getElementById("mClear").addEventListener("click", function(){
  closeMenu();
  if(confirm("确定清空全部日程吗？该操作无法撤销。")){
    var tnow = Date.now();
    state.events.forEach(function(x){ if(!x.deletedAt){ x.deletedAt = tnow; x.updatedAt = tnow; } });
    state.expanded = []; save(); queueSync(); render();
  }
});

/* ================= 编辑弹窗里的实时倒计时 =================
   日程只存日期不存时刻，所以基准是目标日的 00:00 —— 这一点在第二行明写出来，
   不让秒级数字假装自己很精确。只在弹窗打开时跑，关掉立刻停。 */
var cdTimer = null;

function cdPad(n){ return n < 10 ? "0" + n : "" + n; }
/* 把毫秒拆成 天/时/分/秒；天为 0 时省略"天"，时分秒补零 */
function cdSplit(ms){
  var s = Math.floor(ms / 1000);
  var d = Math.floor(s / 86400); s -= d * 86400;
  var h = Math.floor(s / 3600);  s -= h * 3600;
  var m = Math.floor(s / 60);    s -= m * 60;
  return (d > 0 ? d + " 天 " : "") + cdPad(h) + ":" + cdPad(m) + ":" + cdPad(s);
}

function paintCountdown(){
  var box = document.getElementById("fCountdown");
  var d = parseYMD(fDate.value);
  if(!d){ box.hidden = true; return; }
  var mode = pickedMode();
  var now = new Date();
  var target = d.getTime();                       /* 目标日 00:00 */
  var dayEnd = target + 86400000;                 /* 目标日结束 */
  if(mode === "auto") mode = (now.getTime() < dayEnd) ? "down" : "up";

  var num, base, cls = "";
  if(mode === "down"){
    if(now.getTime() < target){
      var left = target - now.getTime();
      num = "还剩 " + cdSplit(left);
      base = "距 " + ymd(d) + " 00:00";
      if(left <= 86400000) cls = "urgent";
      else if(left <= 7 * 86400000) cls = "soon";
    }else if(now.getTime() < dayEnd){
      num = "就是今天 · 还剩 " + cdSplit(dayEnd - now.getTime());
      base = "距今天结束（" + ymd(d) + " 24:00）";
      cls = "urgent";
    }else{
      num = "已过 " + cdSplit(now.getTime() - target);
      base = "从 " + ymd(d) + " 00:00 算起";
      cls = "past";
    }
  }else{
    if(now.getTime() >= target){
      num = "已经 " + cdSplit(now.getTime() - target);
      base = "从 " + ymd(d) + " 00:00 算起";
      cls = "past";
    }else{
      num = "还有 " + cdSplit(target - now.getTime()) + " 开始";
      base = "距 " + ymd(d) + " 00:00";
      cls = "soon";
    }
  }
  document.getElementById("fCdNum").textContent = num;
  document.getElementById("fCdBase").textContent = base;
  box.className = "countdown" + (cls ? " " + cls : "");
  box.hidden = false;
}
function startCountdown(){
  stopCountdown();
  paintCountdown();
  cdTimer = setInterval(paintCountdown, 1000);
}
function stopCountdown(){
  if(cdTimer){ clearInterval(cdTimer); cdTimer = null; }
}

/* ================= 分组的重命名 / 删除 =================
   入口是分组标题栏右边的「⋯」。删除分两种，默认走安全的那种：
     · 解散分组：里面的日程保留，变成"不分组"
     · 连同日程一起删除：走和单条删除一样的墓碑机制，能同步到另一台设备 */
var gmMask = document.getElementById("gmMask");
var gmMenu = document.getElementById("gmMenu");
var gpMask = document.getElementById("gpMask");
var gpTarget = "";        /* 正在管理的分组名 */
var gpMode = "rename";    /* rename | delete */

function closeGroupMenu(){ gmMenu.hidden = true; gmMask.hidden = true; }
function openGroupMenu(name, anchor){
  gpTarget = name;
  gmMenu.innerHTML = "";
  [["重命名分组", function(){ closeGroupMenu(); openGroupSheet("rename"); }],
   ["删除分组",   function(){ closeGroupMenu(); openGroupSheet("delete"); }]
  ].forEach(function(pair){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = pair[0];
    b.addEventListener("click", pair[1]);
    gmMenu.appendChild(b);
  });
  /* 菜单是 fixed 定位的，按锚点算位置；贴着右边缘，别超出屏幕 */
  var r = anchor.getBoundingClientRect();
  gmMenu.hidden = false;
  gmMask.hidden = false;
  var w = gmMenu.offsetWidth || 140;
  var left = Math.min(r.left, document.documentElement.clientWidth - w - 12);
  gmMenu.style.position = "fixed";
  gmMenu.style.left = Math.max(12, left) + "px";
  gmMenu.style.top = (r.bottom + 6) + "px";
}
gmMask.addEventListener("click", closeGroupMenu);

function groupMemberCount(name){
  return liveEvents().filter(function(e){ return (e.group || "").trim() === name; }).length;
}
/* 三个按钮固定存在，只是按模式换位置和文案 */
var gpBtnOk = document.createElement("button");
gpBtnOk.type = "button"; gpBtnOk.id = "gpOk"; gpBtnOk.className = "btn primary";
var gpBtnDel = document.createElement("button");
gpBtnDel.type = "button"; gpBtnDel.id = "gpDelAll"; gpBtnDel.className = "btn btn-danger";
gpBtnDel.textContent = "连同日程一起删";
var gpBtnCancel = document.createElement("button");
gpBtnCancel.type = "button"; gpBtnCancel.id = "gpCancel"; gpBtnCancel.className = "btn";
gpBtnCancel.textContent = "取消";

function openGroupSheet(mode){
  gpMode = mode;
  var n = groupMemberCount(gpTarget);
  var row1 = document.getElementById("gpRow1");
  var row2 = document.getElementById("gpRow2");
  row1.innerHTML = ""; row2.innerHTML = "";
  document.getElementById("gpTitle").textContent =
    (mode === "rename") ? "重命名分组" : "删除分组「" + gpTarget + "」";
  document.getElementById("gpRenameField").hidden = (mode !== "rename");
  document.getElementById("gpInput").value = gpTarget;
  if(mode === "rename"){
    gpBtnOk.textContent = "保存";
    row1.appendChild(gpBtnCancel); row1.appendChild(gpBtnOk);
    row2.hidden = true;
  }else{
    gpBtnOk.textContent = "解散分组";
    row1.appendChild(gpBtnOk); row1.appendChild(gpBtnDel);   /* 解散在左、连同删除在右 */
    row2.appendChild(gpBtnCancel);                           /* 取消单独一行在下面 */
    row2.hidden = false;
  }
  document.getElementById("gpHint").textContent = (mode === "rename")
    ? "改名后这 " + n + " 条日程会跟着走；如果新名字和已有分组重名，两个分组会合并。"
    : "「解散分组」只是把这 " + n + " 条日程移出分组，日程本身还在（变成不分组）；"
      + "右边那个红色的会把这 " + n + " 条日程一起删掉。";
  gpMask.hidden = false;
  document.body.style.overflow = "hidden";
  if(mode === "rename") setTimeout(function(){ try{ document.getElementById("gpInput").focus(); }catch(e){} }, 60);
}
function closeGroupSheet(){
  gpMask.hidden = true;
  document.body.style.overflow = "";
}
gpBtnCancel.addEventListener("click", closeGroupSheet);
gpMask.addEventListener("click", function(e){ if(e.target === gpMask) closeGroupSheet(); });

gpBtnOk.addEventListener("click", function(){
  var now = Date.now();
  if(gpMode === "rename"){
    var name = document.getElementById("gpInput").value.trim().slice(0, 12);
    if(!name){ document.getElementById("gpHint").textContent = "分组名不能是空的。"; return; }
    if(name === gpTarget){ closeGroupSheet(); return; }
    state.events.forEach(function(e){
      if((e.group || "").trim() === gpTarget){ e.group = name; e.updatedAt = now; }
    });
    /* 展开状态跟着改名走，否则改完名字这个组会莫名收起来 */
    state.expanded = state.expanded.map(function(g){ return g === gpTarget ? name : g; });
  }else{
    state.events.forEach(function(e){         /* 解散：日程保留，只是不再属于任何分组 */
      if((e.group || "").trim() === gpTarget){ e.group = ""; e.updatedAt = now; }
    });
  }
  pruneExpanded();
  save(); queueSync(); closeGroupSheet(); render();
});

gpBtnDel.addEventListener("click", function(){
  var n = groupMemberCount(gpTarget);
  if(!confirm("确定把分组「" + gpTarget + "」和里面的 " + n + " 条日程一起删掉吗？此操作无法撤销。")) return;
  var now = Date.now();
  state.events.forEach(function(e){        /* 打墓碑而不是真删，删除才能同步到另一台设备 */
    if((e.group || "").trim() === gpTarget && !e.deletedAt){ e.deletedAt = now; e.updatedAt = now; }
  });
  pruneExpanded();
  save(); queueSync(); closeGroupSheet(); render();
});

/* ================= 日期选择器 =================
   移植自 data-Calculation 那套 iOS 风格选择器：年/月 下拉 + 今天 + 圆形日期格 + 取消/完成。
   那边还有时分秒，这里用不上就没搬。对外的接口没变：值仍然写进 #fDate 的 value（YYYY-MM-DD）。 */
var dpMask = document.getElementById("dpMask");
var dpDays = document.getElementById("dpDays");
var dpYearMenu = document.getElementById("dpYearMenu");
var dpMonthMenu = document.getElementById("dpMonthMenu");
var dpY = 2026, dpM = 9, dpD = 1;

function setFormDate(s){                 /* 同时更新隐藏值和按钮上看得见的文字 */
  var d = parseYMD(s);
  fDate.value = d ? s : "";
  var btn = document.getElementById("fDateBtn");
  var txt = document.getElementById("fDateTxt");
  var sub = document.getElementById("fDateSub");
  if(d){
    txt.textContent = ymd(d) + " " + WEEK[d.getDay()];
    sub.textContent = lunarLabel(d);
    sub.hidden = !sub.textContent;
    btn.classList.remove("empty");
  }else{
    txt.textContent = "请选择日期";
    sub.textContent = ""; sub.hidden = true;
    btn.classList.add("empty");
  }
  if(cdTimer) paintCountdown();
}

function dpBuildMenus(){
  if(dpYearMenu.childElementCount) return;
  var t = today(), y0 = t.getFullYear(), i;
  var frag = document.createDocumentFragment();
  for(i = y0 - 100; i <= y0 + 100; i++){          /* 前后各 100 年，够用又不至于几千项 */
    (function(y){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = y; b.setAttribute("data-y", y);
      b.addEventListener("click", function(){ dpY = y; dpCloseMenus(); dpRender(); });
      frag.appendChild(b);
    })(i);
  }
  dpYearMenu.appendChild(frag);
  var frag2 = document.createDocumentFragment();
  for(i = 1; i <= 12; i++){
    (function(m){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = m; b.setAttribute("data-m", m);
      b.addEventListener("click", function(){ dpM = m; dpCloseMenus(); dpRender(); });
      frag2.appendChild(b);
    })(i);
  }
  dpMonthMenu.appendChild(frag2);
}
function dpCloseMenus(){ dpYearMenu.hidden = true; dpMonthMenu.hidden = true; }
function dpToggleMenu(menu){
  var openIt = menu.hidden;
  dpCloseMenus();
  if(!openIt) return;
  menu.hidden = false;
  /* 打开时把当前值滚到中间，不然 200 个年份要自己找 */
  var cur = menu.querySelector(".on");
  if(cur) cur.scrollIntoView({block:"center"});
}

function dpRender(){
  var t = today();
  document.getElementById("dpYearTxt").textContent = dpY;
  document.getElementById("dpMonthTxt").textContent = dpM;
  var i, bs = dpYearMenu.children;
  for(i = 0; i < bs.length; i++) bs[i].className = (+bs[i].getAttribute("data-y") === dpY) ? "on" : "";
  bs = dpMonthMenu.children;
  for(i = 0; i < bs.length; i++) bs[i].className = (+bs[i].getAttribute("data-m") === dpM) ? "on" : "";

  var first = new Date(dpY, dpM - 1, 1);
  var lead = (first.getDay() + 6) % 7;               /* 周一开头 */
  var total = new Date(dpY, dpM, 0).getDate();
  if(dpD > total) dpD = total;                       /* 1月31日切到2月，日号要收回来 */
  dpDays.innerHTML = "";
  for(i = 0; i < lead; i++){
    var e = document.createElement("button");
    e.type = "button"; e.className = "dp-empty"; e.tabIndex = -1;
    dpDays.appendChild(e);
  }
  for(i = 1; i <= total; i++){
    (function(day){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = day;
      var cls = [];
      if(day === dpD) cls.push("sel");
      if(dpY === t.getFullYear() && dpM === t.getMonth() + 1 && day === t.getDate()) cls.push("today");
      b.className = cls.join(" ");
      b.addEventListener("click", function(){ dpD = day; dpRender(); });
      dpDays.appendChild(b);
    })(i);
  }
}

function dpOpen(){
  dpBuildMenus();
  var d = parseYMD(fDate.value) || today();
  dpY = d.getFullYear(); dpM = d.getMonth() + 1; dpD = d.getDate();
  dpCloseMenus();
  dpRender();
  dpMask.hidden = false;
}
function dpClose(){ dpCloseMenus(); dpMask.hidden = true; }

document.getElementById("fDateBtn").addEventListener("click", dpOpen);
document.getElementById("dpYearBtn").addEventListener("click", function(e){ e.stopPropagation(); dpToggleMenu(dpYearMenu); });
document.getElementById("dpMonthBtn").addEventListener("click", function(e){ e.stopPropagation(); dpToggleMenu(dpMonthMenu); });
document.getElementById("dpToday").addEventListener("click", function(){
  var t = today();
  dpY = t.getFullYear(); dpM = t.getMonth() + 1; dpD = t.getDate();
  dpCloseMenus(); dpRender();
});
document.getElementById("dpCancel").addEventListener("click", dpClose);
document.getElementById("dpDone").addEventListener("click", function(){
  setFormDate(ymd(new Date(dpY, dpM - 1, dpD)));
  dpClose();
});
document.getElementById("dpCard").addEventListener("click", function(e){
  if(!e.target.closest(".dp-sel")) dpCloseMenus();   /* 点空白处收起年/月菜单 */

/* ================= 云同步 =================
   服务端只存一份「事件列表」，视图/排序/主题/展开状态这些是各设备自己的偏好，不同步。
   合并规则：按 id 取并集，同一条取 updatedAt 更新的那一份；删除是打标记(deletedAt)而不是真删，
   所以删除也能传到另一台设备。因此两边即使各自离线改过，合起来也不会丢东西。 */

var SYNC_KEY = "schedule-cards-sync-v1";
var sync = { on:false, code:"", lastAt:0, version:0 };
var syncStatus = "off";      /* off | ok | syncing | error | unsupported */
var syncMsg = "";
var syncTimer = null, syncBusy = false, syncAgain = false;

function loadSync(){
  try{
    var raw = localStorage.getItem(SYNC_KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && typeof d === "object"){
        sync.on = !!d.on;
        sync.code = typeof d.code === "string" ? d.code : "";
        sync.lastAt = d.lastAt || 0;
        sync.version = d.version || 0;
      }
    }
  }catch(e){}
}
function saveSync(){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }catch(e){}
}

function mergeEvents(a, b){
  var map = {}, out = [];
  function stamp(e){ return e.updatedAt || e.createdAt || 0; }
  function take(list){
    (list || []).forEach(function(e){
      if(!e || typeof e !== "object" || !e.id) return;
      var cur = map[e.id];
      if(!cur || stamp(e) > stamp(cur)) map[e.id] = e;
    });
  }
  take(a); take(b);
  for(var k in map){ if(Object.prototype.hasOwnProperty.call(map, k)) out.push(map[k]); }
  return out;
}
/* 两份数据是不是一样：按 id + updatedAt 比对，用来判断要不要上传 */
function fingerprint(list){
  return (list || []).map(function(e){ return e.id + ":" + (e.updatedAt || e.createdAt || 0); })
                     .sort().join("|");
}

function setSync(st, msg){
  syncStatus = st; syncMsg = msg || "";
  paintSync();
}
function timeAgo(ts){
  if(!ts) return "";
  var s = Math.floor((Date.now() - ts) / 1000);
  if(s < 60) return "刚刚";
  if(s < 3600) return Math.floor(s/60) + " 分钟前";
  if(s < 86400) return Math.floor(s/3600) + " 小时前";
  return Math.floor(s/86400) + " 天前";
}
function paintSync(){
  var el = document.getElementById("syncLine");
  if(!el) return;
  if(!sync.on || !sync.code){ el.hidden = true; return; }
  el.hidden = false;
  var txt = { syncing:"同步中…", ok:"已同步 · " + timeAgo(sync.lastAt),
              error:"同步失败：" + syncMsg, unsupported:"当前地址不支持同步", off:"未开启" }[syncStatus] || "";
  el.textContent = "☁ " + txt;
  el.className = "sync-line" + (syncStatus === "error" || syncStatus === "unsupported" ? " bad" : "");
  var box = document.getElementById("syncState");
  if(box) box.textContent = txt;
}

var pendingChange = false;
function queueSync(){
  if(!sync.on || !sync.code) return;
  pendingChange = true;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncNow(); }, 600);
}
/* 页面被切走/关掉时，把还没发出去的改动立刻冲出去——
   否则"手机上改完马上锁屏"这一下，改动就要等到下次打开手机才传得上去 */
function flushSync(){
  if(!sync.on || !sync.code || !pendingChange) return;
  clearTimeout(syncTimer);
  syncNow();
}

async function syncNow(){
  if(!sync.on || !sync.code) return;
  if(syncBusy){ syncAgain = true; return; }      /* 正在同步就排队，避免并发写 */
  syncBusy = true;
  setSync("syncing");
  try{
    var r = await fetch("/api/sync?code=" + encodeURIComponent(sync.code), {cache:"no-store"});
    if(r.status === 404){ setSync("unsupported"); return; }
    var data = await r.json();
    if(!data.ok) throw new Error(data.error || ("读取失败 " + r.status));

    var remote = (data.doc && data.doc.events) || [];

    /* 示例数据一律不参与同步：它在每台设备上"看着一样、id 不同"，
       合并只会把 5 条变成 10 条。开了同步就让示例退场，本地也清掉，不上传 */
    var real = state.events.filter(function(e){ return !e.demo; });
    if(real.length !== state.events.length){
      state.events = real; save(); render();   /* 数据清了，屏幕也要立刻跟上 */
    }

    var before = fingerprint(state.events);
    var merged = mergeEvents(state.events, remote);

    if(fingerprint(merged) !== before){        /* 远端有我这儿没有的：先落地再说 */
      state.events = merged;
      pruneExpanded();
      save();
      render();
    }
    if(fingerprint(merged) !== fingerprint(remote)){   /* 我这儿有远端没有的：上传 */
      var pushed = await pushDoc(merged, data.version);
      if(pushed.conflict){                     /* 另一台设备刚写过：拿它的再合一次，重试一次 */
        var again = mergeEvents(merged, (pushed.doc && pushed.doc.events) || []);
        state.events = again; save(); render();
        pushed = await pushDoc(again, pushed.version);
        if(pushed.conflict) throw new Error("另一台设备正在写入，稍后会自动重试");
      }
      sync.version = pushed.version;
    }else{
      sync.version = data.version;
    }
    sync.lastAt = Date.now();
    pendingChange = false;      /* 本地改动已经上去了，页面被切走时就不用再冲一次 */
    saveSync();
    setSync("ok");
  }catch(e){
    setSync("error", (e && e.message) || "网络异常");
  }finally{
    syncBusy = false;
    if(syncAgain){ syncAgain = false; setTimeout(function(){ syncNow(); }, 400); }
  }
}

async function pushDoc(events, baseVersion){
  var body = JSON.stringify({ code: sync.code, baseVersion: baseVersion, doc: { events: events } });
  /* keepalive 让请求在页面被关掉之后也能发完（浏览器限制 64KB，超了就走普通请求） */
  var opts = { method: "POST", headers: {"Content-Type": "application/json"}, body: body };
  if(body.length < 60000) opts.keepalive = true;
  var r = await fetch("/api/sync", opts);
  var d = await r.json();
  if(r.status === 409) return { conflict: true, version: d.version, doc: d.doc };
  if(!d.ok) throw new Error(d.error || ("上传失败 " + r.status));
  return { conflict: false, version: d.version };
}

/* 打开页面、切回页面、每 30 秒（只在页面可见时）各同步一次 */
function startSyncLoops(){
  setInterval(function(){ if(!document.hidden) syncNow(); }, 30000);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) flushSync();     /* 要走了：把待上传的发出去 */
    else syncNow();                      /* 回来了：拉一次最新的 */
  });
  window.addEventListener("pagehide", flushSync);
  window.addEventListener("focus", function(){ syncNow(); });
  window.addEventListener("online", function(){ syncNow(); });
}

/* ================= 长按拖拽排序 =================
   只在「自定义顺序」下启用。三种可拖的场景，靠"同一个父容器里的同级项"统一处理：
     · 置顶区里的卡片      · 展开的分组里的卡片      · 顶层：未分组卡片 与 分组区块（整组移动）
   与其它手势的分工：短按 = 编辑/展开，长按 450ms = 拿起来拖，拖动期间下拉刷新让位。 */
var DRAG_HOLD = 450;      /* 按住多久算"拿起来" */
var DRAG_SLOP = 10;       /* 按住期间手指动超过这么多，就当是滚动/下拉，取消长按 */

var dragTimer = null, dragOn = false, dragEl = null, dragItems = null, dragTouch = false;
var dragFrom = 0, dragTo = 0, dragStartY = 0, dragOffset = 0, dragH = 0;

function dragEnabled(){ return state.sort === "manual"; }

/* 从被按住的元素往上找：它属于哪个容器、容器里的同级项有哪些 */
function dragScope(target){
  var item = target.closest(".pinned > .card, .pinned > .row, .stack-item, .cards > .card, .list > .row, .group");
  if(!item) return null;
  /* 分组区块只能整体拖，且必须是从它的标题栏起手，避免和"点卡片"抢 */
  if(item.classList.contains("group")){
    if(!target.closest(".group-head")) return null;
    if(target.closest(".g-more") || target.closest(".g-chev")) return null;   /* 这两个是按钮，不当拖拽把手 */
    if(item.classList.contains("pinned-sec")) return null;   /* 置顶区本身不参与排序 */
  }
  var box = item.parentElement;
  if(!box) return null;
  /* 展开的分组内部才可以拖；收起时卡片是叠着的，拖了没有意义 */
  if(box.classList.contains("stack") && !box.classList.contains("is-open")) return null;
  var items = [].slice.call(box.children).filter(function(n){
    return n.nodeType === 1 && !n.classList.contains("pinned-head");
  });
  if(items.length < 2) return null;
  return {item:item, box:box, items:items};
}

function dragCancelHold(){ clearTimeout(dragTimer); dragTimer = null; }

function dragBegin(scope, clientY, byTouch){
  dragOn = true;
  dragTouch = !!byTouch;
  dragEl = scope.item;
  dragItems = scope.items;
  dragFrom = dragItems.indexOf(dragEl);
  dragTo = dragFrom;
  dragStartY = clientY;
  dragOffset = 0;
  dragH = dragEl.getBoundingClientRect().height +
          (scope.box.classList.contains("stack") ? stackGap() : (state.view === "card" ? 14 : 10));
  /* 记下每一项当前的 transform，拖动时在它基础上叠加偏移（堆叠里的项本来就带 transform） */
  dragItems.forEach(function(n){
    n.__base = n.style.transform || "";
    n.classList.add("drag-sliding");
  });
  dragEl.classList.add("drag-lift");
  document.body.classList.add("dragging");
  if(navigator.vibrate) { try{ navigator.vibrate(14); }catch(e){} }
}

function dragPaint(){
  dragItems.forEach(function(n, i){
    var shift = 0;
    if(n === dragEl){
      shift = dragOffset;
    }else if(dragFrom < dragTo && i > dragFrom && i <= dragTo){
      shift = -dragH;                      /* 被拖的往下走，中间这些往上让 */
    }else if(dragFrom > dragTo && i >= dragTo && i < dragFrom){
      shift = dragH;                       /* 往上走，中间这些往下让 */
    }
    n.style.transform = (n.__base ? n.__base + " " : "") + "translate3d(0," + shift.toFixed(1) + "px,0)";
  });
}

function dragMove(clientY){
  dragOffset = clientY - dragStartY;
  var steps = Math.round(dragOffset / dragH);
  var to = Math.max(0, Math.min(dragItems.length - 1, dragFrom + steps));
  if(to !== dragTo) dragTo = to;
  dragPaint();
}

function dragEnd(commit){
  if(!dragOn) return;
  dragItems.forEach(function(n){
    n.classList.remove("drag-sliding");
    n.style.transform = n.__base || "";
    delete n.__base;
  });
  dragEl.classList.remove("drag-lift");
  document.body.classList.remove("dragging");
  var from = dragFrom, to = dragTo, items = dragItems;
  dragOn = false; dragEl = null; dragItems = null;
  /* 松手后浏览器还会补一个 click，要把它吃掉，否则拖完立刻弹出编辑窗 */
  document.body.classList.add("just-dragged");
  setTimeout(function(){ document.body.classList.remove("just-dragged"); }, 350);
  if(commit && to !== from){
    var moved = items.splice(from, 1)[0];
    items.splice(to, 0, moved);
    commitOrder(items);
  }else{
    layoutStacks(false);          /* 没换位就把堆叠的位置复原 */
  }
}

/* 把容器里的新顺序写回数据：先按新顺序算出这批条目的 id 序列，
   再把它们占用的那些 order 值按新顺序重新分配（不动容器之外的条目） */
function commitOrder(items){
  var ids = [];
  items.forEach(function(n){
    if(n.classList.contains("group")){
      var st = n.querySelector(".stack");
      [].slice.call(st.children).forEach(function(w){
        var c = w.querySelector("[data-id]");
        if(c) ids.push(c.getAttribute("data-id"));
      });
    }else{
      var c2 = n.matches("[data-id]") ? n : n.querySelector("[data-id]");
      if(c2) ids.push(c2.getAttribute("data-id"));
    }
  });
  if(!ids.length) return;
  var byId = {};
  state.events.forEach(function(e){ byId[e.id] = e; });
  /* 这批条目原本占着哪些 order 值，就还用这些值，按新顺序发下去 */
  var slots = ids.map(function(id){ return byId[id] ? (byId[id].order || 0) : 0; })
                 .sort(function(a,b){ return a - b; });
  var now = Date.now();
  ids.forEach(function(id, i){
    var e = byId[id];
    if(e && e.order !== slots[i]){ e.order = slots[i]; e.updatedAt = now; }
  });
  save(); queueSync(); render();
}

document.addEventListener("pointerdown", function(e){
  if(!dragEnabled() || dragOn) return;
  if(e.pointerType === "mouse" && e.button !== 0) return;
  if(!mask.hidden || !syncMask.hidden || !menu.hidden || !dpMask.hidden || !gpMask.hidden) return;
  var scope = dragScope(e.target);
  if(!scope) return;
  var y0 = e.clientY, x0 = e.clientX, byTouch = (e.pointerType === "touch");
  dragCancelHold();
  dragTimer = setTimeout(function(){ dragBegin(scope, y0, byTouch); dragPaint(); }, DRAG_HOLD);
  var watch = function(ev2){
    if(dragOn) return;
    if(Math.abs(ev2.clientY - y0) > DRAG_SLOP || Math.abs(ev2.clientX - x0) > DRAG_SLOP) dragCancelHold();
  };
  var stop = function(){
    dragCancelHold();
    document.removeEventListener("pointermove", watch);
    document.removeEventListener("pointerup", stop);
    document.removeEventListener("pointercancel", stop);
  };
  document.addEventListener("pointermove", watch);
  document.addEventListener("pointerup", stop);
  document.addEventListener("pointercancel", stop);
}, true);

document.addEventListener("pointermove", function(e){
  if(!dragOn) return;
  e.preventDefault();
  dragMove(e.clientY);
}, {passive:false});
document.addEventListener("pointerup", function(){ if(dragOn && !dragTouch) dragEnd(true); });
/* 触屏拖动时浏览器一旦判定"这是滚动"就会发 pointercancel 把指针流掐掉，
   所以触屏路径改由下面的 touchmove/touchend 驱动，这里不能跟着把拖拽取消掉 */
document.addEventListener("pointercancel", function(){ if(dragOn && !dragTouch) dragEnd(false); });
/* 拖起来之后不要再触发"点一下就编辑/展开" */
document.addEventListener("click", function(e){
  if(document.body.classList.contains("just-dragged")){ e.stopPropagation(); e.preventDefault(); }
}, true);

/* ================= 下拉刷新 =================
   参数与状态机沿用之前项目验证过的那一套（死区 16 / 阻尼 0.42 / 回弹 .25s）。
   关键是"一锤定音"：方向只在出死区那一刻判一次，判完不再回头，
   否则"上滑到一半回带一下"也会触发刷新。 */
var PTR_DEADZONE = 16;    /* 起手死区：手指按下瞬间的抖动不算数 */
var PTR_DAMPING  = 0.42;  /* 手指位移 × 它 = 指示器位移 */
var PTR_MAX      = 120;   /* 拉到这儿指示器就不再往下走 */
/* 阈值按屏高推导，不写死：矮屏(568)约 57px，高屏(844)约 84px，
   手指实际要走 死区 + 阈值/阻尼，占屏高始终 ≈26% */
function ptrThreshold(){
  return Math.round(Math.min(100, Math.max(56, window.innerHeight * 0.10)));
}

var ptrEl = document.getElementById("ptr");
var ptrStartX = 0, ptrStartY = 0, ptrDist = 0;
var ptrPulling = false, ptrLocked = false, ptrBusy = false;

/* 有浮层打开时不接管手势——弹窗自己要能滚 */
function ptrBlocked(){
  return ptrBusy || dragOn || !mask.hidden || !syncMask.hidden || !menu.hidden || !dpMask.hidden || !gpMask.hidden || !gmMenu.hidden;
}
function ptrPaint(d){
  ptrDist = d;
  ptrEl.style.transform = "translate3d(0," + (d - 64) + "px,0)";
  ptrEl.style.opacity = Math.min(1, d / 40).toFixed(2);
  ptrEl.classList.toggle("ready", d >= ptrThreshold());
}
function ptrReset(animate){
  ptrEl.classList.toggle("anim", !!animate);
  ptrEl.classList.remove("ready", "spin");
  ptrEl.style.transform = "translate3d(0,-64px,0)";
  ptrEl.style.opacity = "0";
  ptrDist = 0;
}
function ptrDoRefresh(){
  ptrBusy = true;
  ptrEl.classList.add("anim", "spin");
  ptrEl.style.transform = "translate3d(0," + (ptrThreshold() - 64 + 12) + "px,0)";
  ptrEl.style.opacity = "1";
  /* 留一眼转圈，直接跳转会像卡死；标记写进 sessionStorage，
     用来区分"我的下拉刷新"和"浏览器手势导致的重载" */
  setTimeout(function(){
    try{ sessionStorage.setItem("ptr-fired", String(Date.now())); }catch(e){}
    if(navigator.onLine === false){
      /* 断网时整页 reload 会变成浏览器的错误页，这时候只做"重读本地数据 + 重绘" */
      load(); loadSync(); render(); ptrBusy = false; ptrReset(true);
      setSync(sync.on ? "error" : "off", "当前没有网络");
      return;
    }
    location.reload();
  }, 260);
}

document.addEventListener("touchstart", function(e){
  if(ptrBlocked() || e.touches.length !== 1 || window.scrollY > 0) return;
  ptrStartX = e.touches[0].clientX;
  ptrStartY = e.touches[0].clientY;
  ptrPulling = true; ptrLocked = false;
}, {passive:true});

document.addEventListener("touchmove", function(e){
  if(dragOn){                       /* 正在拖卡片：自己接管，并挡住浏览器的滚动 */
    e.preventDefault();
    if(e.touches[0]) dragMove(e.touches[0].clientY);
    return;
  }
  if(!ptrPulling || ptrBlocked()) return;
  var dx = e.touches[0].clientX - ptrStartX;
  var dy = e.touches[0].clientY - ptrStartY;

  if(!ptrLocked){
    if(Math.abs(dy) < PTR_DEADZONE && Math.abs(dx) < PTR_DEADZONE) return;  /* 还在死区，继续观察 */
    if(dy <= 0 || Math.abs(dx) > Math.abs(dy)){ ptrPulling = false; return; }  /* 上滑/横滑 → 整次弃权 */
    ptrLocked = true;
    /* 接管手势时，把堆叠卡片的"按下"态收掉，免得它一直陷在按压状态 */
    var ps = document.querySelectorAll(".stack.is-pressed");
    for(var i=0;i<ps.length;i++) ps[i].classList.remove("is-pressed");
  }
  if(dy <= 0 || window.scrollY > 0){        /* 中途改主意往上滑：交还控制权 */
    ptrPulling = false; ptrLocked = false; ptrReset(true); return;
  }
  ptrEl.classList.remove("anim");           /* 跟手过程中不要过渡，否则拖泥带水 */
  ptrPaint(Math.min((dy - PTR_DEADZONE) * PTR_DAMPING, PTR_MAX));
  e.preventDefault();
}, {passive:false});

function ptrEnd(){
  if(dragOn){ dragEnd(true); return; }          /* 拖拽落位，不要走下拉刷新那套 */
  if(!ptrPulling || !ptrLocked){ ptrPulling = false; ptrLocked = false; return; }
  ptrPulling = false; ptrLocked = false;
  if(ptrDist >= ptrThreshold()) ptrDoRefresh();
  else ptrReset(true);
}
document.addEventListener("touchend", ptrEnd, {passive:true});
document.addEventListener("touchcancel", function(){
  if(dragOn){ dragEnd(false); return; }
  ptrPulling = false; ptrLocked = false; ptrReset(true);
}, {passive:true});

/* ================= 跨天自动刷新 ================= */
function tick(){
  var k = ymd(today());
  if(k !== todayKey) render();
}
setInterval(tick, 30000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) tick(); });

/* ================= 启动 ================= */
load();
loadSync();
applyTheme();
viewCard.setAttribute("aria-pressed", state.view === "card" ? "true" : "false");
viewList.setAttribute("aria-pressed", state.view === "list" ? "true" : "false");
sortSel.value = state.sort;
render();
document.getElementById("mSyncState").textContent = sync.on ? "已开启" : "未开启";
if(sync.on && sync.code){ setSync("syncing"); syncNow(); }
startSyncLoops();
setInterval(paintSync, 60000);     /* 只是把"3 分钟前"这种相对时间刷新一下 */

})();
</script>
</body>
</html>
