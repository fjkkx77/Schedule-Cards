<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181d" media="(prefers-color-scheme: dark)">
<meta name="description" content="日程卡片 · 倒数与正数天数统计">
<title>日程卡片</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Cpath d='M0 14a14 14 0 0 1 14-14h36a14 14 0 0 1 14 14v8H0z' fill='%232f86f6'/%3E%3Ctext x='32' y='52' font-size='30' font-weight='700' text-anchor='middle' fill='%2314181d' font-family='Arial,sans-serif'%3E12%3C/text%3E%3C/svg%3E">
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#e9eef4;
  --surface:#ffffff;
  --surface-2:#f4f6f9;
  --grid:#e9edf2;
  --text:#14181d;
  --text-2:#5b6572;
  --text-3:#8a929c;
  --line:#e3e8ee;
  --shadow:0 6px 20px rgba(17,26,38,.10);
  --shadow-sm:0 2px 8px rgba(17,26,38,.06);
  --stack-shadow:0 22px 46px rgba(17,26,38,.24);
  --stack-shadow-sm:0 12px 24px rgba(17,26,38,.18);
  --spring:cubic-bezier(.16,1.24,.3,1);
  --radius-card:20px;
  --radius-row:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181d;
    --surface:#20242b;
    --surface-2:#1a1e24;
    --grid:#272c34;
    --text:#f2f4f7;
    --text-2:#a8b1bd;
    --text-3:#7c8593;
    --line:#2c323b;
    --shadow:0 6px 20px rgba(0,0,0,.45);
    --shadow-sm:0 2px 8px rgba(0,0,0,.3);
    --stack-shadow:0 22px 46px rgba(0,0,0,.6);
    --stack-shadow-sm:0 12px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#15181d;
  --surface:#20242b;
  --surface-2:#1a1e24;
  --grid:#272c34;
  --text:#f2f4f7;
  --text-2:#a8b1bd;
  --text-3:#7c8593;
  --line:#2c323b;
  --shadow:0 6px 20px rgba(0,0,0,.45);
  --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  --stack-shadow:0 22px 46px rgba(0,0,0,.6);
  --stack-shadow-sm:0 12px 24px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
[hidden]{display:none !important}

html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ============ 外层布局 ============ */
.app{
  max-width:600px;
  margin:0 auto;
  padding:calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(104px + var(--safe-b)) calc(12px + var(--safe-l));
}

/* ---- 顶部 ---- */
.topbar{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.5px}
.brand .today{margin:2px 0 0;font-size:13px;color:var(--text-2);font-weight:500}
.icon-btn{
  flex:0 0 auto;width:44px;height:44px;border:0;border-radius:14px;
  background:var(--surface);color:var(--text-2);
  box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.icon-btn:active{transform:scale(.94)}
@media (hover:hover){ .icon-btn:hover{color:var(--text)} }

/* ---- 工具条 ---- */
.toolbar{display:flex;align-items:center;gap:8px;margin:0 2px 14px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;box-shadow:var(--shadow-sm);flex:0 0 auto}
.seg button{
  border:0;background:transparent;color:var(--text-2);
  min-height:44px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;
}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.sort-wrap{flex:1 1 auto;min-width:0;display:flex;justify-content:flex-end}
select.sort{
  min-height:44px;max-width:100%;
  border:0;border-radius:12px;background:var(--surface);color:var(--text-2);
  box-shadow:var(--shadow-sm);padding:0 10px;font-size:14px;font-weight:600;
}

/* ============ 卡片视图 ============ */
.cards{display:flex;flex-direction:column;gap:14px}
.card{
  --c:#2f86f6;--cd:#2670d0;
  position:relative;
  border-radius:var(--radius-card);
  overflow:hidden;
  background:var(--surface);
  box-shadow:var(--shadow);
  border:0;padding:0;width:100%;
  text-align:left;
  display:block;
  color:inherit;
}
.card:active{transform:scale(.99)}
.card-top{
  background:var(--c);
  color:#fff;
  text-align:center;
  font-size:clamp(15px,4.4vw,18px);
  font-weight:800;
  letter-spacing:.5px;
  padding:9px 12px;
}
.card-body{
  display:flex;align-items:center;gap:10px;
  padding:clamp(14px,4.5vw,22px) clamp(14px,4.5vw,20px);
  min-height:118px;
  background-color:var(--surface);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:22px 22px;
  background-position:-1px -1px;
}
.card-left{flex:1 1 auto;min-width:0}
.card-title{
  margin:0;
  font-size:clamp(19px,5.6vw,26px);
  font-weight:800;
  line-height:1.25;
  letter-spacing:.5px;
  overflow-wrap:anywhere;   /* 中文标题一律完整换行显示，不用省略号截断 */
}
.card-sub{margin:6px 0 0;font-size:clamp(12px,3.5vw,15px);color:var(--text-2);font-weight:500}
.tag{
  display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;
  font-size:11px;font-weight:700;color:var(--c);
  background:color-mix(in srgb, var(--c) 14%, transparent);
}
@supports not (color: color-mix(in srgb, red, blue)){ .tag{background:var(--surface-2)} }
.card-num{
  flex:0 0 auto;display:flex;align-items:flex-end;gap:4px;
  padding-left:6px;
}
.card-num .n{
  font-size:clamp(48px,16vw,86px);
  font-weight:800;line-height:.92;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.card-num .u{
  font-size:clamp(14px,4.2vw,21px);font-weight:700;color:var(--text-2);
  transform:translateY(-.3em);
}
.card-num[data-len="4"] .n{font-size:clamp(40px,12.6vw,70px)}
.card-num[data-len="5"] .n{font-size:clamp(31px,10vw,56px)}
.card-num.is-today .n{font-size:clamp(30px,9.4vw,52px);letter-spacing:0}
.card-num.is-today .u{display:none}
.card-num .n.past{color:var(--text-2)}

/* ============ 列表视图 ============ */
.list{
  background:var(--surface-2);
  border-radius:18px;
  padding:10px;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;
}
.row{
  --c:#f5a13c;--cd:#ef7d20;
  display:flex;align-items:stretch;
  background:var(--surface);
  border-radius:var(--radius-row);
  overflow:hidden;
  min-height:58px;
  box-shadow:var(--shadow-sm);
  border:0;padding:0;width:100%;text-align:left;color:inherit;
}
.row:active{transform:scale(.995)}
.row-main{
  flex:1 1 auto;min-width:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:8px 10px 8px 14px;
}
.row-title{
  font-size:clamp(16px,4.6vw,19px);font-weight:700;line-height:1.3;
  overflow-wrap:anywhere;
}
.row-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.row-badge{flex:0 0 auto;display:flex;align-items:stretch}
.row-badge .n{
  background:var(--c);color:#fff;
  min-width:clamp(56px,17vw,80px);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(19px,5.6vw,24px);font-weight:800;
  font-variant-numeric:tabular-nums;
  padding:0 6px;letter-spacing:-.01em;
}
.row-badge .n[data-len="4"]{font-size:clamp(16px,4.6vw,21px)}
.row-badge .n[data-len="5"]{font-size:clamp(14px,4vw,18px)}
.row-badge .n.today-txt{font-size:clamp(14px,4vw,18px);letter-spacing:0}
.row-badge .u{
  background:var(--cd);color:#fff;
  width:clamp(38px,11vw,50px);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(14px,4.2vw,18px);font-weight:700;
}
.row-badge .u.past-u{font-size:clamp(12px,3.6vw,15px);letter-spacing:0}

/* ============ 分组堆叠 ============ */
.group{display:block}
.group-head{
  display:flex;align-items:center;gap:8px;width:100%;
  min-height:44px;padding:0 6px;margin:0;border:0;background:transparent;
  color:var(--text-2);font-size:14px;font-weight:800;letter-spacing:.5px;
  text-align:left;
}
.g-name{overflow-wrap:anywhere;min-width:0}
.g-count{
  flex:0 0 auto;
  font-size:12px;font-weight:700;color:var(--text-3);
  background:var(--surface);padding:2px 9px;border-radius:99px;
  box-shadow:var(--shadow-sm);
}
.list .g-count{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.g-chev{
  margin-left:auto;flex:0 0 auto;
  width:26px;height:26px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--text-3);
  background:var(--surface);box-shadow:var(--shadow-sm);
  transition:transform .34s cubic-bezier(.22,1,.36,1);
}
.group-head[aria-expanded="true"] .g-chev{transform:rotate(180deg)}
.group-head:active .g-name{opacity:.6}

/* 堆叠容器：真 3D 透视，子项绝对定位后只靠 transform 移动（交给合成器） */
.stack{
  position:relative;
  perspective-origin:50% 0;      /* 灭点放在这一摞的顶边，越往后的卡越往里退 */
  transform-origin:center top;
  transition:height .62s var(--spring), transform .22s ease;
}
.stack.is-pressed{transform:scale(.972)}   /* 按下去整摞往里一压，像真的按到一叠卡 */
.stack > .stack-item{
  position:absolute;left:0;top:0;width:100%;
  transform-origin:center top;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  will-change:transform;
  transition:transform .62s var(--spring), opacity .42s ease;
}
/* 越往后的层压一层暗色，做出"退进阴影里"的空气感 */
.stack > .stack-item::after{
  content:"";position:absolute;inset:0;
  border-radius:var(--radius-card);
  background:#0a1018;opacity:var(--dim,0);
  pointer-events:none;
  transition:opacity .5s ease;
}
.list .stack > .stack-item::after{border-radius:var(--radius-row)}
/* 收起时最上面那张替整摞投影，压得越实越像一叠 */
.stack:not(.is-open) > .stack-item[data-layer="0"] > .card{box-shadow:var(--stack-shadow)}
.stack:not(.is-open) > .stack-item[data-layer="0"] > .row{box-shadow:var(--stack-shadow-sm)}
/* 首次渲染 / 改尺寸时直接就位，不要动画 */
.no-anim .stack, .no-anim .stack > .stack-item{transition:none !important}
@media (prefers-reduced-motion: reduce){
  .stack, .stack > .stack-item, .g-chev{transition:none !important}
}

/* ============ 空状态 ============ */
.empty{
  text-align:center;padding:56px 20px;color:var(--text-2);
  background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);
}
.empty .big{font-size:38px;margin-bottom:10px}
.empty p{margin:0 0 4px;font-size:15px}

/* ============ 悬浮新增按钮 ============ */
.fab{
  position:fixed;right:calc(16px + var(--safe-r));bottom:calc(18px + var(--safe-b));
  width:58px;height:58px;border-radius:20px;border:0;
  background:#2f86f6;color:#fff;font-size:30px;line-height:1;
  box-shadow:0 8px 22px rgba(47,134,246,.42);
  display:flex;align-items:center;justify-content:center;
  z-index:30;
}
.fab:active{transform:scale(.93)}

/* ============ 菜单 ============ */
.menu-mask{position:fixed;inset:0;z-index:40}
.menu{
  position:fixed;z-index:41;
  top:calc(58px + var(--safe-t));right:calc(12px + var(--safe-r));
  min-width:196px;max-width:calc(100vw - 24px);
  background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
  padding:6px;overflow:hidden;
}
.menu button, .menu label{
  display:flex;align-items:center;gap:10px;width:100%;
  min-height:46px;padding:0 12px;border:0;background:transparent;
  border-radius:10px;font-size:15px;font-weight:600;text-align:left;color:var(--text);
}
.menu button:active,.menu label:active{background:var(--surface-2)}
@media (hover:hover){ .menu button:hover,.menu label:hover{background:var(--surface-2)} }
.menu .danger{color:#e0483d}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 8px}
.switch{margin-left:auto;font-size:13px;color:var(--text-2);font-weight:700}

/* ============ 弹窗（新增/编辑） ============ */
.mask{
  position:fixed;inset:0;z-index:50;
  background:rgba(12,16,22,.42);
  display:flex;align-items:flex-end;justify-content:center;
  padding:0;
}
@media (min-width:560px){ .mask{align-items:center;padding:20px} }
.sheet{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--surface);
  border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + var(--safe-b));
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
@media (min-width:560px){ .sheet{border-radius:20px;padding-bottom:18px} }
.sheet h2{margin:2px 0 16px;font-size:19px;font-weight:800}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.field input[type="text"],.field input[type="date"],.field select{
  width:100%;min-height:48px;
  border:1px solid var(--line);border-radius:12px;
  background:var(--surface-2);
  padding:0 12px;font-size:16px;
}
.field input[type="date"]{-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{outline:2px solid #2f86f6;outline-offset:1px;border-color:transparent}
.modes{display:flex;gap:8px}
.modes input{position:absolute;opacity:0;width:0;height:0}
.modes label{
  flex:1 1 0;min-width:0;min-height:48px;margin:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--line);
  font-size:15px;font-weight:700;color:var(--text-2);
  touch-action:manipulation;
}
.modes input:checked + label{background:#2f86f6;color:#fff;box-shadow:none}
.modes input:focus-visible + label{outline:2px solid var(--text);outline-offset:2px}
.hint{margin:8px 2px 0;font-size:13px;line-height:1.5;color:var(--text-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{
  min-height:44px;padding:0 14px;border:0;border-radius:12px;
  background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);
  font-size:14px;font-weight:700;color:var(--text-2);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chips button.on{background:#2f86f6;color:#fff;box-shadow:none}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors input{position:absolute;opacity:0;width:0;height:0}
.colors label{
  width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  margin:0;color:#fff;font-size:18px;font-weight:800;
}
.colors input:checked + label::after{content:"✓"}
.colors input:focus-visible + label{outline:2px solid var(--text);outline-offset:2px}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{
  flex:1 1 auto;min-height:50px;border:0;border-radius:14px;
  font-size:16px;font-weight:700;
  background:var(--surface-2);color:var(--text);
  box-shadow:inset 0 0 0 1px var(--line);
}
.btn.primary{background:#2f86f6;color:#fff;box-shadow:none}
.btn.ghost-danger{flex:0 0 auto;width:56px;background:transparent;color:#e0483d;box-shadow:inset 0 0 0 1px var(--line);font-size:20px}
.btn:active{transform:scale(.98)}
.extra-row{display:flex;gap:10px;margin-top:6px}
.extra-row .btn{min-height:44px;font-size:14px}

.foot{margin:22px 4px 0;text-align:center;font-size:12px;color:var(--text-3);line-height:1.7}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>日程卡片</h1>
      <p class="today" id="todayLine">今天</p>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="更多设置" aria-haspopup="true">⋯</button>
  </div>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="视图切换">
      <button id="viewCard" aria-pressed="true">卡片</button>
      <button id="viewList" aria-pressed="false">列表</button>
    </div>
    <div class="sort-wrap">
      <select class="sort" id="sortSel" aria-label="排序方式">
        <option value="manual">自定义顺序</option>
        <option value="days">按天数临近</option>
        <option value="date">按日期先后</option>
        <option value="created">按创建时间</option>
        <option value="updated">按最近修改</option>
      </select>
    </div>
  </div>

  <main id="board"></main>

  <p class="foot">数据保存在本机浏览器里，换设备或清理缓存会丢失，重要日程记得用「导出备份」。</p>
</div>

<button class="fab" id="addBtn" aria-label="新增日程">＋</button>

<!-- 菜单 -->
<div class="menu-mask" id="menuMask" hidden></div>
<div class="menu" id="menu" hidden>
  <button id="mToggleDate">列表显示日期<span class="switch" id="mDateState">关</span></button>
  <button id="mTheme">主题<span class="switch" id="mThemeState">跟随系统</span></button>
  <hr>
  <button id="mExport">导出备份</button>
  <button id="mImport">导入备份</button>
  <hr>
  <button id="mClear" class="danger">清空全部日程</button>
</div>
<input type="file" id="fileInput" accept="application/json,.json" hidden>

<!-- 新增 / 编辑 -->
<div class="mask" id="mask" hidden>
  <form class="sheet" id="form">
    <h2 id="sheetTitle">新增日程</h2>

    <div class="field">
      <label for="fTitle">事件名称</label>
      <input type="text" id="fTitle" maxlength="30" placeholder="例如：回家过年啦" autocomplete="off">
    </div>

    <div class="field">
      <label>计算方式</label>
      <div class="modes" id="fModes">
        <input type="radio" name="mode" id="modeDown" value="down"><label for="modeDown">倒数</label>
        <input type="radio" name="mode" id="modeUp" value="up"><label for="modeUp">正数</label>
        <input type="radio" name="mode" id="modeAuto" value="auto"><label for="modeAuto">自动</label>
      </div>
      <p class="hint" id="modeHint"></p>
    </div>

    <div class="field">
      <label for="fDate" id="dateLabel">目标日期</label>
      <input type="date" id="fDate">
    </div>

    <div class="field" id="repeatField">
      <label for="fRepeat">重复</label>
      <select id="fRepeat">
        <option value="none">不重复</option>
        <option value="year">每年（生日 / 纪念日）</option>
      </select>
    </div>

    <div class="field">
      <label for="fGroup">分组</label>
      <input type="text" id="fGroup" maxlength="12" placeholder="留空＝不分组" autocomplete="off">
      <div class="chips" id="fGroupChips"></div>
    </div>

    <div class="field">
      <label>颜色</label>
      <div class="colors" id="fColors"></div>
    </div>

    <div class="actions">
      <button type="button" class="btn ghost-danger" id="fDelete" aria-label="删除此日程" hidden>🗑</button>
      <button type="button" class="btn" id="fCancel">取消</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
    <div class="extra-row">
      <button type="button" class="btn" id="fTop" hidden>移到最前</button>
    </div>
  </form>
</div>

<script>
(function(){
"use strict";

/* ================= 常量 ================= */
var STORE_KEY = "schedule-cards-v1";
var WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
var COLORS = ["#2f86f6","#f5a13c","#ef4d4d","#22b07d","#8a6ef2","#4b5563"];
var THEMES = [
  {v:"auto",  t:"跟随系统"},
  {v:"light", t:"浅色"},
  {v:"dark",  t:"深色"}
];

/* ================= 状态 ================= */
var state = {
  events: [],
  view: "card",
  sort: "manual",
  showDateInList: false,
  theme: "auto",
  expanded: []          /* 处于展开状态的分组名 */
};
var editingId = null;
var todayKey = "";

/* ================= 本地存储（可能被禁用，全部包 try） ================= */
function load(){
  var raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch(e){ raw = null; }
  if(!raw){ state.events = seed(); migrate(); save(); return; }
  try{
    var d = JSON.parse(raw);
    if(d && Array.isArray(d.events)) state.events = d.events;
    if(d && (d.view === "card" || d.view === "list")) state.view = d.view;
    if(d && d.sort) state.sort = d.sort;
    if(d && typeof d.showDateInList === "boolean") state.showDateInList = d.showDateInList;
    if(d && d.theme) state.theme = d.theme;
    if(d && Array.isArray(d.expanded)) state.expanded = d.expanded;
  }catch(e){
    state.events = seed();
  }
  migrate();
}

/* 老数据补齐新字段：分组、创建时间、修改时间。
   创建时间按原有数组顺序倒推，保证「按创建时间」排序对老数据也等于原来的顺序 */
function migrate(){
  var now = Date.now(), n = state.events.length, changed = false;
  state.events.forEach(function(e, i){
    if(typeof e.group !== "string"){ e.group = ""; changed = true; }
    if(typeof e.createdAt !== "number"){ e.createdAt = now - (n - i) * 60000; changed = true; }
    if(typeof e.updatedAt !== "number"){ e.updatedAt = e.createdAt; changed = true; }
  });
  if(changed) save();
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function seed(){
  var t = new Date();
  var y = t.getFullYear();
  return [
    {id:uid(), title:"回家过年啦", date:"2027-01-10", mode:"down", repeat:"none", color:"#2f86f6", group:"生活"},
    {id:uid(), title:"我的生日",   date:(y)+"-11-06",  mode:"down", repeat:"year", color:"#f5a13c", group:"生活"},
    {id:uid(), title:"四级考试",   date:(y)+"-12-19",  mode:"down", repeat:"none", color:"#ef4d4d", group:"考试"},
    {id:uid(), title:"计组考试",   date:(y+1)+"-01-04",mode:"down", repeat:"none", color:"#8a6ef2", group:"考试"},
    {id:uid(), title:"开学第一天", date:ymd(new Date(y, t.getMonth(), 1)), mode:"up", repeat:"none", color:"#22b07d", group:""}
  ];
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ================= 日期工具（全部按“零点”比较，避免时区/时分误差） ================= */
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function today(){ return midnight(new Date()); }
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function parseYMD(s){
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s||""));
  if(!m) return null;
  var d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d.getTime()) ? null : d;
}
/* 2月29日这类日期，在没有该日的年份里退到当月最后一天 */
function makeDate(y, mo, day){
  var last = new Date(y, mo+1, 0).getDate();
  return new Date(y, mo, Math.min(day, last));
}
function dayDiff(a, b){ return Math.round((a - b) / 86400000); }

/* 计算方式：down=倒数（还剩多少天），up=正数（累计多少天），auto=未来倒数/过去正数 */
function modeOf(ev){
  return (ev.mode === "down" || ev.mode === "up") ? ev.mode : "auto";
}

/* 算出这条日程“当前指向”的那一天。正数模式的起算日永远是原始日期，不参与每年重复 */
function resolve(ev, t){
  var base = parseYMD(ev.date);
  if(!base) return null;
  if(ev.repeat !== "year" || modeOf(ev) === "up") return {date: base, cycle: 0, base: base};
  var cand = makeDate(t.getFullYear(), base.getMonth(), base.getDate());
  if(cand < t) cand = makeDate(t.getFullYear()+1, base.getMonth(), base.getDate());
  return {date: cand, cycle: cand.getFullYear() - base.getFullYear(), base: base};
}

/* 深浅色都用得上的“压暗”函数：不依赖 color-mix，兼容性最好 */
function shade(hex, ratio){
  var m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if(!m) return hex;
  var v = parseInt(m[1], 16);
  var r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
  function f(x){ return Math.max(0, Math.min(255, Math.round(x * (1 + ratio)))); }
  return "#" + pad2(f(r)) + pad2(f(g)) + pad2(f(b));
}
function pad2(n){ var s = n.toString(16); return s.length < 2 ? "0" + s : s; }

/* ================= 渲染 ================= */
var board = document.getElementById("board");

function sortedEvents(){
  var t = today();
  var arr = state.events.slice();
  if(state.sort === "days"){
    arr.sort(function(a,b){
      return rank(a,t) - rank(b,t);
    });
  }else if(state.sort === "date"){
    arr.sort(function(a,b){
      var ra = resolve(a,t), rb = resolve(b,t);
      if(!ra) return 1; if(!rb) return -1;
      return ra.date - rb.date;
    });
  }else if(state.sort === "created"){        /* 先建的排前面 */
    arr.sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
  }else if(state.sort === "updated"){        /* 最近改过的排前面 */
    arr.sort(function(a,b){ return (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0); });
  }
  return arr;
}

/* 把排好序的列表按分组聚拢：分组出现的位置＝该组第一条的位置，未分组的各自独立占位 */
function groupize(list){
  var out = [], idx = {};
  list.forEach(function(ev){
    var g = (ev.group || "").trim();
    if(!g){ out.push({name:"", items:[ev]}); return; }
    if(!Object.prototype.hasOwnProperty.call(idx, g)){
      idx[g] = out.length;
      out.push({name:g, items:[]});
    }
    out[idx[g]].items.push(ev);
  });
  return out;
}

function allGroups(){
  var seen = {}, out = [];
  state.events.forEach(function(e){
    var g = (e.group || "").trim();
    if(g && !Object.prototype.hasOwnProperty.call(seen, g)){ seen[g] = 1; out.push(g); }
  });
  return out;
}
function isExpanded(name){ return state.expanded.indexOf(name) > -1; }
/* 分组被删空/改名后，把记在展开列表里的空壳清掉 */
function pruneExpanded(){
  var live = allGroups();
  state.expanded = state.expanded.filter(function(g){ return live.indexOf(g) > -1; });
}
/* 未来的按“还剩几天”从小到大排前面；已过去的排后面，越近的越靠前 */
function rank(ev, t){
  var r = resolve(ev, t);
  if(!r) return 1e9;
  var d = dayDiff(r.date, t);
  return d >= 0 ? d : 500000 - d;
}

function render(){
  var t = today();
  todayKey = ymd(t);
  document.getElementById("todayLine").textContent =
    ymd(t) + " " + WEEK[t.getDay()];

  var list = sortedEvents();
  board.innerHTML = "";

  if(list.length === 0){
    var e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = '<div class="big">🗓</div><p>还没有日程</p><p style="color:var(--text-3);font-size:13px">点右下角的「＋」添加第一个</p>';
    board.appendChild(e);
    return;
  }

  var isCard = state.view === "card";
  var box = document.createElement("div");
  box.className = isCard ? "cards" : "list";

  groupize(list).forEach(function(g){
    var make = function(ev){ return isCard ? cardEl(ev, t) : rowEl(ev, t); };

    if(!g.name){                                  /* 没分组的直接平铺 */
      box.appendChild(make(g.items[0]));
      return;
    }

    var sec = document.createElement("section");
    sec.className = "group";

    var head = document.createElement("button");
    head.type = "button";
    head.className = "group-head";
    head.setAttribute("aria-expanded", isExpanded(g.name) ? "true" : "false");
    head.innerHTML = '<span class="g-name"></span><span class="g-count"></span><span class="g-chev">▾</span>';
    head.querySelector(".g-name").textContent = g.name;
    head.querySelector(".g-count").textContent = g.items.length;
    head.addEventListener("click", function(){ toggleGroup(g.name); });

    var stack = document.createElement("div");
    stack.className = "stack";
    stack.setAttribute("data-group", g.name);
    /* 收起状态下按住这一摞会整体往里压一下，松开才展开——手感上像真的按到一叠卡 */
    if(g.items.length > 1){
      var press = function(on){
        return function(){
          stack.classList.toggle("is-pressed", on && !isExpanded(g.name));
        };
      };
      stack.addEventListener("pointerdown", press(true));
      stack.addEventListener("pointerup", press(false));
      stack.addEventListener("pointercancel", press(false));
      stack.addEventListener("pointerleave", press(false));
    }
    g.items.forEach(function(ev){
      var wrap = document.createElement("div");
      wrap.className = "stack-item";
      wrap.appendChild(make(ev));
      stack.appendChild(wrap);
    });

    sec.appendChild(head);
    sec.appendChild(stack);
    box.appendChild(sec);
  });

  board.appendChild(box);
  layoutStacks(false);
}

/* ---- 堆叠布局 ----
   收起：只露出最上面一张，后面每张往下探出 PEEK 像素、逐层缩小，像一叠卡片
   展开：依次排成一列，每张之间留 GAP
   位置全部用 transform 表达，容器只改 height，动画交给合成器 */
var PERSPECTIVE = 880;  /* 透视距离，直接写到 .stack 上，保证 CSS 与这里的算式同源 */
var DEPTH = 150;        /* 每往后一层退多远（z 轴），退得越远投影越小 —— 这才是空间感的来源 */
var TILT = 1.15;        /* 每层轻微歪一点点，像随手叠上去的 */
var DIM = .07;          /* 每往后一层压多少暗色（压太狠会把彩色badge压成脏褐色，实测调低） */
var VISIBLE = 3;        /* 收起时最多露几层 */

/* 露出量和间距都跟着视图走：卡片高（~160px）撑得住大露出，列表行只有 58px */
function stackPeek(){ return state.view === "card" ? 26 : 12; }
function stackGap(){ return state.view === "card" ? 14 : 10; }

function layoutStacks(animate){
  var stacks = board.querySelectorAll(".stack");
  if(!stacks.length) return;
  if(!animate) board.classList.add("no-anim");

  for(var s = 0; s < stacks.length; s++){
    var stack = stacks[s];
    var items = stack.children;
    var n = items.length;
    if(!n) continue;

    var name = stack.getAttribute("data-group");
    /* 只有一张时没有“堆”的概念，永远当展开处理 */
    var open = (n === 1) || isExpanded(name);

    var h = [], i;
    for(i = 0; i < n; i++) h[i] = items[i].offsetHeight;   /* 先量完再写，避免反复触发重排 */

    stack.style.perspective = PERSPECTIVE + "px";   /* 与下面的 k 算式同源，避免两处各写一个值 */
    stack.classList.toggle("is-open", open);

    var gap = stackGap(), peek = stackPeek(), total;
    if(open){
      var y = 0;
      for(i = 0; i < n; i++){
        place(items[i], {y:y, z:0, tilt:0, dim:0, blur:0, op:1, pe:"auto", z9:n - i, layer:i,
                         delay: animate ? i * 62 : 0});
        y += h[i] + gap;
      }
      total = y - gap;
    }else{
      /* 每一层往后退 DEPTH 像素，透视把它投影成 k 倍大小：k = P / (P + 深度)。
         灭点定在这一摞的顶边(perspective-origin:50% 0)，所以投影就是绕顶边的等比缩放，
         于是「第 i 层的底边正好比上一层低 peek 像素」可以反解出它该往下平移多少：
             ty = (h0 + i*peek) / k - h[i]
         这样卡片高、列表行矮，都能得到同样的露出量，不用按某一档硬写死。 */
      for(i = 0; i < n; i++){
        var L = Math.min(i, VISIBLE);
        var k = PERSPECTIVE / (PERSPECTIVE + L * DEPTH);
        var ty = (h[0] + L * peek) / k - h[i];
        place(items[i], {
          y: ty, z: -L * DEPTH, tilt: (i % 2 ? 1 : -1) * L * TILT,
          dim: L * DIM, blur: L >= 2 ? 1.4 : 0,
          op: i < VISIBLE ? 1 : 0, pe: i < VISIBLE ? "auto" : "none",
          z9: n - i, layer: i,
          delay: animate ? (n - 1 - i) * 40 : 0
        });
      }
      total = h[0] + Math.min(n - 1, VISIBLE - 1) * peek;
    }
    stack.style.height = total + "px";
  }

  if(!animate){
    void board.offsetHeight;          /* 强制应用一次，再把动画打开 */
    board.classList.remove("no-anim");
  }
}

function place(el, o){
  el.style.transform =
    "translate3d(0," + o.y.toFixed(2) + "px," + o.z.toFixed(1) + "px)" +
    (o.tilt ? " rotate(" + o.tilt.toFixed(2) + "deg)" : " rotate(0deg)");
  el.style.opacity = o.op.toFixed(2);
  el.style.filter = o.blur ? ("blur(" + o.blur + "px)") : "";
  el.style.setProperty("--dim", o.dim.toFixed(3));
  el.style.pointerEvents = o.pe;
  el.style.zIndex = String(o.z9);
  el.style.transitionDelay = o.delay ? (o.delay + "ms") : "0ms";
  el.setAttribute("data-layer", String(o.layer));
  /* 被压在下面看不见的那几张，别让键盘 Tab 还能聚焦到 */
  var btn = el.firstElementChild;
  if(btn) btn.tabIndex = (o.pe === "none") ? -1 : 0;
}

function toggleGroup(name){
  var i = state.expanded.indexOf(name);
  if(i > -1) state.expanded.splice(i, 1);
  else state.expanded.push(name);
  save();
  var heads = board.querySelectorAll(".group-head");
  for(var k = 0; k < heads.length; k++){
    var st = heads[k].nextElementSibling;
    if(st && st.getAttribute("data-group") === name){
      heads[k].setAttribute("aria-expanded", isExpanded(name) ? "true" : "false");
    }
  }
  layoutStacks(true);
}

/* 窗口尺寸变化 / 字体加载完，卡片高度会变，重新量一次 */
var reflowTimer = null;
window.addEventListener("resize", function(){
  clearTimeout(reflowTimer);
  reflowTimer = setTimeout(function(){ layoutStacks(false); }, 120);
});
if(document.fonts && document.fonts.ready && document.fonts.ready.then){
  document.fonts.ready.then(function(){ layoutStacks(false); });
}

/* 一条日程当前要显示成什么样，全部在这里算清楚
   state:  left      倒数中——距离目标还剩 N 天
           dueToday  倒数到期——就是今天
           overdue   倒数已过期——目标日已经过去 N 天
           elapsed   正数中——从起算日起已累计 N 天
           startToday正数起算日就是今天
           notStarted正数的起算日还没到——N 天后开始   */
function numInfo(ev, t){
  var r = resolve(ev, t);
  if(!r) return {bad:true};
  var d = dayDiff(r.date, t);              /* >0 在未来，<0 已过去 */
  var m = modeOf(ev);
  if(m === "auto") m = (d >= 0) ? "down" : "up";

  var state;
  if(m === "down") state = d > 0 ? "left" : (d === 0 ? "dueToday" : "overdue");
  else             state = d < 0 ? "elapsed" : (d === 0 ? "startToday" : "notStarted");

  var UNIT = {left:"天", overdue:"天前", elapsed:"天了", notStarted:"天后"};
  var TEXT = {dueToday:"就是今天", startToday:"今天开始"};

  return {
    mode: m,
    state: state,
    diff: d,
    abs: Math.abs(d),
    unit: UNIT[state] || "",
    bigText: TEXT[state] || "",
    muted: state === "overdue" || state === "notStarted",
    target: r.date,
    cycle: r.cycle,
    dateLabel: (m === "down" ? "目标 " : "起算 ")
  };
}

function groupCount(g){
  var c = 0;
  state.events.forEach(function(e){ if((e.group || "").trim() === g) c++; });
  return c;
}
/* 收起状态下点这一叠＝展开；展开状态（或没分组、组里只有一条）下点＝编辑 */
function activate(ev){
  var g = (ev.group || "").trim();
  if(g && !isExpanded(g) && groupCount(g) > 1){ toggleGroup(g); return; }
  openForm(ev.id);
}

function tagEl(text){
  var s = document.createElement("span");
  s.className = "tag";
  s.textContent = text;
  return s;
}

function cardEl(ev, t){
  var info = numInfo(ev, t);
  var el = document.createElement("button");
  el.type = "button";
  el.className = "card";
  el.style.setProperty("--c", ev.color || COLORS[0]);
  el.style.setProperty("--cd", shade(ev.color || COLORS[0], -0.16));
  el.setAttribute("aria-label", (ev.title || "未命名") + "，点击编辑");

  var top = document.createElement("div");
  top.className = "card-top";
  top.textContent = (t.getMonth()+1) + "月" + t.getDate() + "日 " + WEEK[t.getDay()];

  var body = document.createElement("div");
  body.className = "card-body";

  var left = document.createElement("div");
  left.className = "card-left";
  var h = document.createElement("h2");
  h.className = "card-title";
  h.textContent = ev.title || "未命名";
  var sub = document.createElement("p");
  sub.className = "card-sub";
  if(info.bad){
    sub.textContent = "日期无效";
  }else{
    sub.textContent = info.dateLabel + ymd(info.target) + " " + WEEK[info.target.getDay()];
    if(ev.repeat === "year" && info.mode === "down"){
      sub.appendChild(tagEl(info.cycle > 0 ? "第" + info.cycle + "年" : "每年"));
    }
    if(info.state === "overdue")    sub.appendChild(tagEl("已过期"));
    if(info.state === "elapsed")    sub.appendChild(tagEl("已累计"));
    if(info.state === "notStarted") sub.appendChild(tagEl("未开始"));
  }
  left.appendChild(h); left.appendChild(sub);

  var num = document.createElement("div");
  num.className = "card-num";
  var n = document.createElement("span");
  n.className = "n";
  var u = document.createElement("span");
  u.className = "u";
  if(info.bad){
    n.textContent = "—";
    u.textContent = "天";
  }else if(info.bigText){
    num.classList.add("is-today");
    n.textContent = info.bigText;
  }else{
    n.textContent = String(info.abs);
    u.textContent = info.unit;
    num.setAttribute("data-len", String(info.abs).length);
    if(info.muted) n.classList.add("past");
  }
  num.appendChild(n); num.appendChild(u);

  body.appendChild(left); body.appendChild(num);
  el.appendChild(top); el.appendChild(body);
  el.addEventListener("click", function(){ activate(ev); });
  return el;
}

function rowEl(ev, t){
  var info = numInfo(ev, t);
  var el = document.createElement("button");
  el.type = "button";
  el.className = "row";
  el.style.setProperty("--c", ev.color || COLORS[1]);
  el.style.setProperty("--cd", shade(ev.color || COLORS[1], -0.16));
  el.setAttribute("aria-label", (ev.title || "未命名") + "，点击编辑");

  var main = document.createElement("div");
  main.className = "row-main";
  var tt = document.createElement("div");
  tt.className = "row-title";
  tt.textContent = ev.title || "未命名";
  main.appendChild(tt);
  if(state.showDateInList && !info.bad){
    var s = document.createElement("div");
    s.className = "row-sub";
    var extra = "";
    if(ev.repeat === "year" && info.mode === "down") extra += " · 每年";
    if(info.state === "overdue")    extra += " · 已过期";
    if(info.state === "elapsed")    extra += " · 已累计";
    if(info.state === "notStarted") extra += " · 未开始";
    s.textContent = info.dateLabel + ymd(info.target) + " " + WEEK[info.target.getDay()] + extra;
    main.appendChild(s);
  }

  var badge = document.createElement("div");
  badge.className = "row-badge";
  var n = document.createElement("div");
  n.className = "n";
  var u = document.createElement("div");
  u.className = "u";
  if(info.bad){
    n.textContent = "—";
    u.textContent = "天";
  }else if(info.bigText){
    n.textContent = info.bigText;
    n.classList.add("today-txt");
    u.hidden = true;                 /* 「就是今天」「今天开始」整格让给文字 */
  }else{
    n.textContent = String(info.abs);
    n.setAttribute("data-len", String(info.abs).length);
    u.textContent = info.unit;       /* 天 / 天前 / 天了 / 天后，一眼看出是倒数还是正数 */
    if(info.unit.length > 1) u.classList.add("past-u");
  }
  badge.appendChild(n); badge.appendChild(u);

  el.appendChild(main); el.appendChild(badge);
  el.addEventListener("click", function(){ activate(ev); });
  return el;
}

/* ================= 视图 / 排序 / 主题 ================= */
var viewCard = document.getElementById("viewCard");
var viewList = document.getElementById("viewList");
function setView(v){
  state.view = v;
  viewCard.setAttribute("aria-pressed", v === "card" ? "true" : "false");
  viewList.setAttribute("aria-pressed", v === "list" ? "true" : "false");
  save(); render();
}
viewCard.addEventListener("click", function(){ setView("card"); });
viewList.addEventListener("click", function(){ setView("list"); });

var sortSel = document.getElementById("sortSel");
sortSel.addEventListener("change", function(){
  state.sort = sortSel.value; save(); render();
});

function applyTheme(){
  var root = document.documentElement;
  if(state.theme === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", state.theme);
  var i = 0;
  for(var k=0;k<THEMES.length;k++){ if(THEMES[k].v === state.theme) i = k; }
  document.getElementById("mThemeState").textContent = THEMES[i].t;
}

/* ================= 菜单 ================= */
var menu = document.getElementById("menu");
var menuMask = document.getElementById("menuMask");
function openMenu(){
  document.getElementById("mDateState").textContent = state.showDateInList ? "开" : "关";
  applyTheme();
  menu.hidden = false; menuMask.hidden = false;
}
function closeMenu(){ menu.hidden = true; menuMask.hidden = true; }
document.getElementById("menuBtn").addEventListener("click", openMenu);
menuMask.addEventListener("click", closeMenu);

document.getElementById("mToggleDate").addEventListener("click", function(){
  state.showDateInList = !state.showDateInList;
  document.getElementById("mDateState").textContent = state.showDateInList ? "开" : "关";
  save(); render();
});
document.getElementById("mTheme").addEventListener("click", function(){
  var i = 0;
  for(var k=0;k<THEMES.length;k++){ if(THEMES[k].v === state.theme) i = k; }
  state.theme = THEMES[(i+1) % THEMES.length].v;
  applyTheme(); save();
});
document.getElementById("mExport").addEventListener("click", function(){
  closeMenu();
  var data = JSON.stringify({app:"schedule-cards", version:1, events:state.events}, null, 2);
  var blob = new Blob([data], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "日程卡片备份_" + todayKey + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});
var fileInput = document.getElementById("fileInput");
document.getElementById("mImport").addEventListener("click", function(){
  closeMenu(); fileInput.value = ""; fileInput.click();
});
fileInput.addEventListener("change", function(){
  var f = fileInput.files && fileInput.files[0];
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var d = JSON.parse(String(fr.result));
      var arr = Array.isArray(d) ? d : (d && d.events);
      if(!Array.isArray(arr)) throw new Error("格式不对");
      var clean = [];
      arr.forEach(function(x){
        if(!x || !parseYMD(x.date)) return;
        clean.push({
          id: x.id || uid(),
          title: String(x.title || "未命名").slice(0,30),
          date: x.date,
          mode: (x.mode === "down" || x.mode === "up") ? x.mode : "auto",
          repeat: x.repeat === "year" ? "year" : "none",
          group: typeof x.group === "string" ? x.group.trim().slice(0,12) : "",
          color: /^#[0-9a-fA-F]{6}$/.test(x.color || "") ? x.color : COLORS[0],
          createdAt: (typeof x.createdAt === "number" && x.createdAt > 0) ? x.createdAt : undefined,
          updatedAt: (typeof x.updatedAt === "number" && x.updatedAt > 0) ? x.updatedAt : undefined
        });
      });
      if(!clean.length) throw new Error("没有可用的日程");
      state.events = clean;
      migrate();                    /* 备份文件里没有创建时间的，按顺序补上 */
      pruneExpanded();
      save(); render();
    }catch(e){
      alert("导入失败：" + e.message);
    }
  };
  fr.readAsText(f);
});
document.getElementById("mClear").addEventListener("click", function(){
  closeMenu();
  if(confirm("确定清空全部日程吗？该操作无法撤销。")){
    state.events = []; state.expanded = []; save(); render();
  }
});

/* ================= 新增 / 编辑弹窗 ================= */
var mask = document.getElementById("mask");
var form = document.getElementById("form");
var fTitle = document.getElementById("fTitle");
var fDate = document.getElementById("fDate");
var fRepeat = document.getElementById("fRepeat");
var fModes = document.getElementById("fModes");
var modeHint = document.getElementById("modeHint");
var dateLabel = document.getElementById("dateLabel");
var repeatField = document.getElementById("repeatField");

var MODE_HINT = {
  down: "距离这一天还剩多少天，到当天显示「就是今天」。",
  up:   "从这一天起，往后累计一共过了多少天，每天 +1。",
  auto: "日期在未来就倒数、在过去就正数，由日期自动决定。"
};
function pickedMode(){
  var r = form.querySelector('input[name="mode"]:checked');
  return r ? r.value : "down";
}
function syncModeUI(){
  var m = pickedMode();
  modeHint.textContent = MODE_HINT[m];
  dateLabel.textContent = (m === "up") ? "起算日期" : (m === "down" ? "目标日期" : "日期");
  /* 正数是从固定的起算日往后累计，“每年重复”对它没有意义，直接藏起来 */
  repeatField.hidden = (m === "up");
}
fModes.addEventListener("change", syncModeUI);
var fColors = document.getElementById("fColors");
var fGroup = document.getElementById("fGroup");
var fGroupChips = document.getElementById("fGroupChips");

/* 已有分组做成一排快捷按钮：点一下填进输入框，再点一下取消 */
function buildGroupChips(){
  fGroupChips.innerHTML = "";
  var groups = allGroups();
  if(!groups.length){ fGroupChips.hidden = true; return; }
  fGroupChips.hidden = false;
  groups.forEach(function(g){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = g;
    if(fGroup.value.trim() === g) b.className = "on";
    b.addEventListener("click", function(){
      fGroup.value = (fGroup.value.trim() === g) ? "" : g;
      syncGroupChips();
    });
    fGroupChips.appendChild(b);
  });
}
function syncGroupChips(){
  var cur = fGroup.value.trim();
  var bs = fGroupChips.children;
  for(var i = 0; i < bs.length; i++){
    bs[i].className = (bs[i].textContent === cur) ? "on" : "";
  }
}
document.getElementById("fGroup").addEventListener("input", syncGroupChips);
var fDelete = document.getElementById("fDelete");
var fTop = document.getElementById("fTop");

COLORS.forEach(function(c, i){
  var id = "clr" + i;
  var input = document.createElement("input");
  input.type = "radio"; input.name = "color"; input.value = c; input.id = id;
  var label = document.createElement("label");
  label.setAttribute("for", id);
  label.style.background = c;
  label.title = c;
  fColors.appendChild(input); fColors.appendChild(label);
});
function pickedColor(){
  var r = form.querySelector('input[name="color"]:checked');
  return r ? r.value : COLORS[0];
}
function setColor(c){
  var list = form.querySelectorAll('input[name="color"]');
  var hit = false;
  for(var i=0;i<list.length;i++){
    if(list[i].value.toLowerCase() === String(c||"").toLowerCase()){ list[i].checked = true; hit = true; }
  }
  if(!hit && list.length) list[0].checked = true;
}

function openForm(id){
  editingId = id || null;
  var ev = null;
  if(id){
    for(var i=0;i<state.events.length;i++){ if(state.events[i].id === id) ev = state.events[i]; }
  }
  document.getElementById("sheetTitle").textContent = ev ? "编辑日程" : "新增日程";
  fTitle.value = ev ? (ev.title || "") : "";
  /* iOS 上空的 date 控件是完全空白的一个图标，所以永远给个默认值 */
  fDate.value = ev ? ev.date : todayKey;
  var m = ev ? modeOf(ev) : "down";
  var mr = form.querySelector('input[name="mode"][value="' + m + '"]');
  if(mr) mr.checked = true;
  syncModeUI();
  fRepeat.value = ev && ev.repeat === "year" ? "year" : "none";
  fGroup.value = ev ? (ev.group || "") : "";
  buildGroupChips();
  setColor(ev ? ev.color : COLORS[0]);
  fDelete.hidden = !ev;
  fTop.hidden = !(ev && state.sort === "manual" && state.events.length > 1);
  mask.hidden = false;
  document.body.style.overflow = "hidden";
  if(!ev) setTimeout(function(){ try{ fTitle.focus(); }catch(e){} }, 60);
}
function closeForm(){
  mask.hidden = true;
  document.body.style.overflow = "";
  editingId = null;
}
document.getElementById("addBtn").addEventListener("click", function(){ openForm(null); });
document.getElementById("fCancel").addEventListener("click", closeForm);
mask.addEventListener("click", function(e){ if(e.target === mask) closeForm(); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ if(!mask.hidden) closeForm(); if(!menu.hidden) closeMenu(); }
});

form.addEventListener("submit", function(e){
  e.preventDefault();
  var title = fTitle.value.trim() || "未命名";
  var date = fDate.value;
  if(!parseYMD(date)){ alert("请选择一个有效日期"); return; }
  var mode = pickedMode();
  var repeat = (mode === "up") ? "none" : fRepeat.value;   /* 正数模式不支持每年重复 */
  var group = fGroup.value.trim().slice(0, 12);
  var now = Date.now();
  if(editingId){
    for(var i=0;i<state.events.length;i++){
      if(state.events[i].id === editingId){
        state.events[i].title = title;
        state.events[i].date = date;
        state.events[i].mode = mode;
        state.events[i].repeat = repeat;
        state.events[i].group = group;
        state.events[i].color = pickedColor();
        state.events[i].updatedAt = now;
      }
    }
  }else{
    state.events.push({id:uid(), title:title, date:date, mode:mode, repeat:repeat,
                       group:group, color:pickedColor(), createdAt:now, updatedAt:now});
  }
  /* 新东西刚放进某个分组，就把那个分组展开，免得看不见自己刚存的那条 */
  if(group && !isExpanded(group)) state.expanded.push(group);
  pruneExpanded();
  save(); closeForm(); render();
});

fDelete.addEventListener("click", function(){
  if(!editingId) return;
  if(!confirm("删除这条日程？")) return;
  state.events = state.events.filter(function(x){ return x.id !== editingId; });
  pruneExpanded();
  save(); closeForm(); render();
});
fTop.addEventListener("click", function(){
  if(!editingId) return;
  var idx = -1;
  for(var i=0;i<state.events.length;i++){ if(state.events[i].id === editingId) idx = i; }
  if(idx > 0){
    var it = state.events.splice(idx,1)[0];
    state.events.unshift(it);
  }
  save(); closeForm(); render();
});

/* ================= 跨天自动刷新 ================= */
function tick(){
  var k = ymd(today());
  if(k !== todayKey) render();
}
setInterval(tick, 30000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) tick(); });

/* ================= 启动 ================= */
load();
applyTheme();
viewCard.setAttribute("aria-pressed", state.view === "card" ? "true" : "false");
viewList.setAttribute("aria-pressed", state.view === "list" ? "true" : "false");
sortSel.value = state.sort;
render();

})();
</script>
</body>
</html>
